# F-SUB-02 — Tier gating (mobile UI affordances)
# Phase 3 Agent 10 — Subscriptions module
#
# Spec source: docs/testing/SPEC_AND_DEMOS_MATRIX.md § Module 10
# Acceptance criteria covered:
#   AC1: Free tier blocked from PDF / email / photos / quotes / expenses / job logs
#   AC2: Error response includes upgrade-path messaging
#   AC3: Beta mode (BETA_MODE!=='false') bypasses gates
#
# Implementation under test:
#   - apps/api/src/middleware/subscription.ts:requireFeature (returns 403
#     FEATURE_NOT_AVAILABLE)
#   - apps/mobile/app/subscription.tsx renders the upgrade prompt
#   - Feature-gated screens (e.g. quotes/create, expenses/create) should
#     show an upgrade banner when the user is on free tier and BETA_MODE off
#
# Demo flow:
#   1. Launch with a free-tier user (or assume current user is free)
#   2. Open the subscription screen — confirm beta banner / current tier
#   3. Verify the gating UI surfaces (upgrade button / beta-mode message)
#
# Beta-mode caveat: in beta the upgrade button shows the "Launch Pricing"
# alert (apps/mobile/app/subscription.tsx:175). This is the *current*
# user-visible behaviour. Phase 4 will revisit once BETA_MODE=false.
appId: nz.instilligent.bossboard
tags:
  - subscriptions
  - F-SUB-02
---
- launchApp:
    clearState: false
- assertVisible: "BossBoard"
- takeScreenshot: 40-pre-gating
# Navigate to subscription screen
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - tapOn:
          text: "Subscription"
          optional: true
# Beta mode UI signal (apps/mobile/app/subscription.tsx:259)
- assertVisible:
    text: "Launch Pricing"
    optional: true
- takeScreenshot: 40-beta-banner-or-free-tier
# Tap upgrade on Tradie tier — should show beta-mode alert OR open Stripe
- tapOn:
    text: "Upgrade"
    optional: true
- takeScreenshot: 40-upgrade-tap-result
