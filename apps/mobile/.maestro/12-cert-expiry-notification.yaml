# F-CERT-02 — Cert expiry tracking + notification visual confirmation.
#
# Phase 3 Agent 3 of 2026-05-23-e2e-demo-spec-coverage-suite plan.
# Spec source: docs/testing/SPEC_AND_DEMOS_MATRIX.md § F-CERT-02.
#
# Pre-requisites:
#   - A cert exists with expiry within the next 30 days for the
#     signed-in user. The recommended seed approach (per spec
#     "demo script outline"):
#         A) POST /api/v1/certifications with expiryDate = today + 7d
#            BEFORE running this flow. The API spec
#            (certifications.api.spec.ts) does this; running it first
#            populates the dev DB.
#         B) OR: complete 10-cert-create.yaml but change the expiry
#            date input to a near-future ISO date for the demo run.
#
# Verifies acceptance criteria:
#   AC1 — GET /certifications/expiring returns near-expiry certs; the
#         mobile list renders an "Expiring soon" badge for them.
#   AC5 — The cert row shows the cert name + days-remaining context.
#
# NOTE: The actual push notification arrival is NOT asserted here —
# Maestro on iOS/Android simulators does not reliably surface push
# notifications for assertion. The API spec
# (certifications.api.spec.ts F-CERT-02 AC4) exercises the
# POST /notifications/check-expiry control path. This Maestro flow
# pins the IN-APP banner / list state — what a tradie actually sees
# when they open the app within the threshold window.

appId: nz.instilligent.bossboard
---
- launchApp:
    clearState: false
- tapOn:
    text: "People"
# The badge text "Expiring soon" appears for any cert within 30d.
# This pins the F-CERT-02 visual surface; the data path is exercised
# in the API spec.
- assertVisible:
    text: "Expiring soon"
- takeScreenshot: 12-cert-expiry-badge-visible
# Optional: filter to expiring-only view if the screen exposes it
# (see app/certifications/index.tsx — statusFilter state has
# 'expiring' option).
- tapOn:
    text: "Expiring"
    optional: true
- takeScreenshot: 12-cert-expiring-filter
