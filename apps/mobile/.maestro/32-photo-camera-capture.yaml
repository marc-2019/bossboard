# F-PHOTO-01 — Camera capture flow
#
# Acceptance criteria exercised:
#   - User can tap the "+" / Add button on an entity detail screen.
#   - Camera permission grant flow runs (auto-granted via launchApp.permissions).
#   - Capture path succeeds (Maestro can't trigger a real shutter on a
#     simulator — the action sheet sentinel + camera-roll fallback is what
#     we assert. On a real device this drives the OS camera UI.).
#
# Mobile-primary surface. Pre-conditions:
#   - User is logged in (created by an earlier auth flow OR the app's
#     persisted session).
#   - There is at least one entity (invoice / expense / job / swms) with a
#     PhotoAttachments widget — see PhotoAttachments.tsx.
#
# Tagged so Phase 4 can group all photo flows: `--include-tags=photos`
appId: nz.instilligent.bossboard
tags:
  - photos
  - photo-camera
---
- launchApp:
    clearState: false   # keep prior session — photos require auth + entity
    permissions:
      all: allow        # grant camera + photos by default for the flow
- assertVisible: "BossBoard"
- takeScreenshot: 32-01-app-launched

# Navigate to an entity with photo attachments. We try expenses first
# (PhotoAttachments is embedded in apps/mobile/app/expenses/[id].tsx),
# but if the user lands on the Home tab we fall back through the bottom nav.
- runFlow:
    when:
      visible:
        text: "Money"
    commands:
      - tapOn: "Money"
      - takeScreenshot: 32-02-money-tab

# Open the first invoice or expense to reach the PhotoAttachments widget.
# `optional: true` so the flow is robust against an empty list — Marc sees
# the UI either way during a headed demo.
- tapOn:
    text: ".*"
    index: 0
    optional: true

- takeScreenshot: 32-03-entity-detail

# Open the "Add" photo dialog. PhotoAttachments renders the Add button only
# when editable=true.
- tapOn:
    text: "Add"
    optional: true
- takeScreenshot: 32-04-add-photo-sheet

# Action sheet: Camera | Photo Library | Cancel
- tapOn:
    text: "Camera"
    optional: true
- takeScreenshot: 32-05-camera-permission-or-shutter

# On a simulator without a working camera, ImagePicker.launchCameraAsync
# returns canceled=true and the UI returns to the entity detail screen.
# We assert one of: (a) the photos counter incremented (real device), or
# (b) we returned to the entity detail screen (simulator cancel path).
- assertVisible:
    text: "Photos.*"
    optional: true
- takeScreenshot: 32-06-after-camera
