# Maestro flow: F-EXP-03 — Update / delete expense
#
# Spec: docs/testing/SPEC_AND_DEMOS_MATRIX.md § Module 6 F-EXP-03
# Plan: docs/superpowers/plans/2026-05-23-e2e-demo-spec-coverage-suite.md M.4
#
# Drives the detail screen: open list → tap a row → assert detail
# screen → tap "Delete Expense" → confirm destructive Alert → assert
# row is gone from the list.
#
# Drift note: mobile detail screen (apps/mobile/app/expenses/[id].tsx)
# currently has Delete but NO Edit affordance. PUT /api/v1/expenses/:id
# works at the API level (covered in e2e/demos/api/expenses.api.spec.ts
# F-EXP-03 AC1) but there is no mobile UI to drive it as of 2026-05-23.
# This flow asserts the Delete leg only and documents the missing
# Edit UI in docs/testing/coverage/expenses.md.
#
# Pre-req: 26-expense-create.yaml has run OR an expense exists.
#
# Status: NOT YET RUN. Parent task is syntax-verify only. Validate:
#   maestro test .maestro/28-expense-edit-delete.yaml --include-tags=expenses --debug-output /tmp/maestro

appId: nz.instilligent.bossboard
tags:
  - expenses
  - F-EXP-03
---
- launchApp:
    clearState: false
- assertVisible: "BossBoard"

- tapOn: "Money"
- tapOn: "Expenses"
- takeScreenshot: 28-00-list

# Tap the first expense row. We rely on the description text the
# 26-* flow seeded ("PVC fittings + flux"). If not present, the
# flow skips the detail-screen leg.
- runFlow:
    when:
      visible: "PVC fittings"
    commands:
      - tapOn: "PVC fittings"
      - takeScreenshot: 28-01-detail-screen

      # Assert detail screen rendered key facts (see [id].tsx:127
      # styles.amount + categoryLabel).
      - assertVisible:
          text: ".*\\$45\\..*"
      - assertVisible: "Materials"

      # Delete leg.
      - tapOn: "Delete Expense"
      - takeScreenshot: 28-02-delete-confirm-alert

      # Native Alert with "Cancel" / "Delete". Confirm.
      - tapOn: "Delete"
      - takeScreenshot: 28-03-after-delete

      # Back on the list; the deleted row should no longer be present.
      - assertNotVisible: "PVC fittings"
      - takeScreenshot: 28-04-list-after-delete

# If the row wasn't there, take a screenshot of the list so the
# demo run isn't a silent no-op.
- runFlow:
    when:
      notVisible: "PVC fittings"
    commands:
      - takeScreenshot: 28-05-no-seed-row
