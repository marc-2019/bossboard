# F-INV-02: List invoices (filter by status)
#
# Demo flow: Money tab → Invoices list shows at least one invoice with a
# status badge. The list is the entry point for filtering — the demo only
# proves the list renders + the segmented status filter exists.
appId: com.instilligent.bossboard
---
- launchApp
- tapOn:
    text: "Money"
- tapOn:
    text: "Invoices"
- assertVisible: "Invoices"
- takeScreenshot: 14-inv-list
