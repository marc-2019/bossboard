# F-QUO-02 — Quote PDF export (mobile)
#
# Spec: docs/testing/SPEC_AND_DEMOS_MATRIX.md § Module 5 / F-QUO-02
# Surface: apps/mobile/app/quotes/[id].tsx
# Trade scenario: continues from 23-quote-create.yaml (Smith Residence bathroom reno)
#
# Acceptance criteria covered:
#   AC1: detail screen exposes a Download PDF affordance
#   AC2: tapping it triggers expo-file-system download (no crash; toast / share sheet)
#   AC3: PDF filename contains the quote number prefix
#
# Pre-req: at least one quote exists for the logged-in user (from 23-quote-create.yaml).
#
# NO EXECUTION: written for syntax-verification only.

appId: nz.instilligent.bossboard
---
- launchApp:
    clearState: false
- tapOn:
    text: "Money"
    optional: true
- assertVisible:
    text: "Smith Residence"
    optional: true
- takeScreenshot: 24-quote-pdf-money-list
# Drill into the first quote (the one we created in 23-quote-create)
- tapOn:
    text: "Smith Residence"
- takeScreenshot: 24-quote-pdf-detail-loaded
# PDF / download button — UI candidate names
- tapOn:
    text: "Download PDF"
    optional: true
- tapOn:
    text: "Share PDF"
    optional: true
- tapOn:
    text: "PDF"
    optional: true
- tapOn:
    id: "quote-download-pdf"
    optional: true
- takeScreenshot: 24-quote-pdf-shared
# Loose assertion — Maestro can\'t reach into the OS share sheet, so we
# look for any post-tap UI indicator. A "Quote-QU-" prefix in the share
# sheet is the strongest signal but lives in a system UI; we settle for
# the absence of crash + the share sheet being dismissable.
- back:
    optional: true
- assertVisible:
    text: "Smith Residence"
- takeScreenshot: 24-quote-pdf-returned-to-detail
