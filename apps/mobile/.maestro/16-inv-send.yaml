# F-INV-04: Mark invoice as sent
#
# Demo flow: open a draft invoice, tap "Mark as sent", confirm the status
# badge changes from "draft" to "sent". The detail page calls
# POST /api/v1/invoices/:id/send.
appId: nz.instilligent.bossboard
---
- launchApp
- tapOn:
    text: "Money"
- tapOn:
    text: "Invoices"
- tapOn:
    index: 0
    text: "Smith Residence"
- tapOn:
    text: "Mark as sent"
- assertVisible: "sent"
- takeScreenshot: 16-inv-marked-sent
