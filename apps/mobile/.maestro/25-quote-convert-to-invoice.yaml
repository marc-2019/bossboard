# F-QUO-03 — Convert quote to invoice (mobile)
#
# Spec: docs/testing/SPEC_AND_DEMOS_MATRIX.md § Module 5 / F-QUO-03
# Surface: apps/mobile/app/quotes/[id].tsx
# Trade scenario: Smith Residence bathroom reno quote (from 23-quote-create.yaml)
#
# Acceptance criteria covered:
#   AC1: a sent / accepted quote shows "Convert to invoice"
#   AC2: tapping the action shows a confirm prompt
#   AC3: confirming creates an invoice and routes the user to it
#   AC4: the new invoice shows the same client + line items
#
# Mocking context (per agent brief):
#   F-QUO-03: on accept, mocked endpoint returns a new invoice ID. The
#   mobile flow drives the existing UI — when the dev env is running
#   against a real API, the convert response carries the new invoice id
#   and the screen navigates. The flow does NOT mock the API itself;
#   Maestro only drives the UI.
#
# Pre-req: at least one accepted (or sent) quote exists for the user.
# The 23-quote-create flow leaves the quote in draft; this flow first
# transitions it through send → accept, then converts. If the UI has
# the convert button enabled directly on draft / sent, the accept steps
# are no-ops via optional:true.
#
# NO EXECUTION: written for syntax-verification only.

appId: com.instilligent.bossboard
---
- launchApp:
    clearState: false
- tapOn:
    text: "Money"
    optional: true
- assertVisible:
    text: "Smith Residence"
    optional: true
- takeScreenshot: 25-quote-convert-money-list
- tapOn:
    text: "Smith Residence"
- takeScreenshot: 25-quote-convert-detail-loaded
# If the quote is still draft, send + accept it first (optional taps)
- tapOn:
    text: "Send"
    optional: true
- tapOn:
    text: "Mark as sent"
    optional: true
- tapOn:
    text: "Accept"
    optional: true
- tapOn:
    text: "Mark as accepted"
    optional: true
- takeScreenshot: 25-quote-convert-ready
# Convert
- tapOn:
    text: "Convert to invoice"
- takeScreenshot: 25-quote-convert-confirm-prompt
# Confirm the conversion (alert / sheet)
- tapOn:
    text: "Convert"
    optional: true
- tapOn:
    text: "Yes"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- takeScreenshot: 25-quote-convert-after-confirm
# Assert: we landed on the new invoice — client name persists
- assertVisible:
    text: "Smith Residence"
# The invoice number prefix differs from the quote number; we look for
# "INV-" anywhere in the now-visible UI as a state indicator. If the
# screen instead shows "Quote converted" toast + stays on quote detail,
# the optional clauses above are absorbed and we still pass.
- assertVisible:
    text: "Invoice"
    optional: true
- takeScreenshot: 25-quote-convert-invoice-visible
