name: Compose port lockdown

on:
  pull_request:
    paths:
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - ".github/workflows/compose-port-lockdown.yml"
      - ".github/scripts/check_compose_ports.py"
      - ".github/port-lockdown-exclusions.yml"
      - ".github/port-lockdown-fixtures/**"

permissions:
  contents: read

jobs:
  port-bind-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Every compose file binds every host publish to 127.0.0.1
        run: python .github/scripts/check_compose_ports.py --repo

      - name: Must fail on the committed unbound fixture
        run: |
          if python .github/scripts/check_compose_ports.py .github/port-lockdown-fixtures/unbound.yml; then
            echo "Expected .github/port-lockdown-fixtures/unbound.yml to fail the port check, but it passed."
            exit 1
          fi
          echo "Unbound fixture fails the check as expected."
