name: secret-scan-gate

# Prevention control: a PR/push that adds a NEW real secret FAILS this gate.
# Reviewed/benign findings recorded in .secrets-baseline.json are accepted.
#
# This reuses CortexForge's EXACT calibrated secret detection
# (tools/secret-scan-gate.py is a verbatim copy of SECRET_PATTERNS + the
# benign-match calibration), so it cannot drift from the upstream verifier.
# It complements the gitleaks workflow (secrets-scan.yml); both must pass.
#
# The gate NEVER prints a secret value — only file:line:pattern:fingerprint.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan-gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: secret-scan-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full tree)
        uses: actions/checkout@v4
        with:
          # Full history so `git ls-files` sees every tracked file on the
          # branch/PR tip.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run secret-scan gate
        run: python3 tools/secret-scan-gate.py
