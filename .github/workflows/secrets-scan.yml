name: secrets-scan

# Prevention control alongside secret-scan.yml. gitleaks fails the job on
# any finding. The job runs the checksummed 8.30.1 binary (the gitleaks-action
# download is not checksummed). Push and pull_request scan added lines in
# the commit range (--redact, --ignore-gitleaks-allow, exit code 2 on leaks).
# An unresolved before..HEAD range fails the job; gitleaks itself exits 0
# when that range cannot be resolved. workflow_dispatch scans full history,
# including merge-commit diffs, and stays red until history is rewritten.
# This job does not rewrite git history.
#
# gitleaks 8.30.1 loads {source}/.gitleaksignore even with
# --ignore-gitleaks-allow, and `git log -p` drops patches for paths marked
# binary or -diff. The job removes a worktree ignore file or directory and
# neutralises global, checkout, and in-repo gitattributes before detect.
# History mode scans patch hunks only, so author, committer, and commit
# message text are piped separately. Annotated tag objects are not commits:
# a tag push scans the tag object (tagger and message) and, when the tag
# peels to a blob, that blob. workflow_dispatch scans every annotated tag
# object. The pinned checkout rewrites the pushed annotated tag ref to the
# peeled commit, so that ref is fetched again before the tag object is read.
# Ref names are scanned and are never written to the job log: a lightweight
# tag or branch whose name is a secret has no commit to fail on, and echoing
# the name would publish it.
#
# Known limits: git notes are not scanned. A rename-only history patch omits
# the file body when rename detection is on; the changed-blob scan still
# reads an add or rename destination when that commit is in the range.
# Submodule gitlinks (mode 160000) are not traversed.
#
# The scan does not read .gitleaks.toml, a baseline, or allowlists from the
# commit under test. Rules come from the checksum-pinned gitleaks v8.30.1
# config with the global path allowlist emptied (that list skips images,
# office/bin extensions, and gitleaks.toml, and `extend useDefault = true`
# keeps it). BossBoard's narrow regex and stopword allowlist is appended
# in this workflow. Two exact false-positive literals live in their own
# [[allowlists]] block with no paths, because a path entry is a whole-file
# skip. The file is written outside the worktree and passed with --config.
# Changed blobs are also scanned with --no-git.
#
# gitleaks 8.30.1 treats a file as an archive only when the filename matches
# an archive extension. A deflated zip named notes.bin or notes.png, a zip
# member named inner.bin, gzip named notes.bin, and a .gz whose payload is
# a zip are not unpacked by gitleaks. The changed-blob walk extracts by
# magic and writes the inner bytes for that --no-git pass. gzip, bzip2, and
# xz are stream-decompressed with a 32MiB cap before any tar parser;
# exceeding the cap fails the job (a gzip of zeros is an empty tar if the
# cap is not applied first, and gitleaks would inflate it with no cap).
# That check runs before the history detect, because history mode also
# opens archives by filename and has no byte cap.
# 7z, rar, and zstd are recognised and fail closed until they are actually
# scanned. A declared uncompressed size over 32MiB, more than 2000 members,
# or nesting deeper than 8 also fails the job. This is not complete
# coverage: those formats are refused, not extracted.
#
# One expired historical JWT (rule jwt, .claude/settings.local.json:25,
# commit 9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2, scrubbed in 6db9dcb) is
# suppressed only by that fingerprint in the temp ignore file this job
# writes. That blob is not materialized. The same line is still present in
# 1e844d1e, which edits the file without touching the line, so history mode
# does not see it and --no-git would. That line is dropped only when its
# sha256 matches; the rest of the file is still scanned. There is no path
# or commit allowlist, and the token is not stored in this file.
#
# BossBoard does not ship Cortex-Forge's secret-rule pytest fixtures, so
# those steps are not copied. Local scans still use the repo .gitleaks.toml
# via scripts/scan-secrets.sh; this job does not.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # pull_request checkout HEAD is the synthetic merge commit
          # (refs/pull/<n>/merge). Its first parent is the PR base and its
          # second parent is the PR head. `git log --first-parent base..HEAD`
          # follows only that first parent, so the range contains the merge
          # commit and none of the PR-branch commits. Scan
          # base..pull_request.head.sha, which is those PR commits.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          unset GITLEAKS_CONFIG || true
          unset GITLEAKS_CONFIG_TOML || true

          # Upstream v8.30.1 rules, checksum-pinned. The global path
          # allowlist is emptied so png/pdf/bin/gitleaks.toml are scanned.
          # Per-rule allowlists stay. BossBoard regexes and stopwords are
          # appended here and are not read from the commit under test.
          cfg_src="$(mktemp)"
          SCAN_CONFIG="$(mktemp)"
          IGNORE_DIR="$(mktemp -d)"
          # History fingerprint only. The worktree .gitleaksignore is removed
          # below, so this temp file is the only ignore list the job loads.
          # The token itself is not written here.
          printf '%s\n' '9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2:.claude/settings.local.json:jwt:25' > "${IGNORE_DIR}/.gitleaksignore"
          downloaded=0
          for _attempt in 1 2 3; do
            if curl -fsSL -o "$cfg_src" https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml; then
              downloaded=1
              break
            fi
            sleep 2
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Could not download the pinned gitleaks config"
            exit 1
          fi
          echo "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf  ${cfg_src}" | sha256sum -c -
          python3 - "$cfg_src" "$SCAN_CONFIG" <<'PY'
          import sys
          import tomllib

          src_path, dest_path = sys.argv[1], sys.argv[2]
          with open(src_path, encoding="utf-8") as handle:
              src = handle.read()
          marker = "\n[[rules]]\n"
          idx = src.find(marker)
          if idx < 0:
              sys.exit("pinned gitleaks config has no rules table")
          head, tail = src[:idx], src[idx:]
          pstart = head.find("paths = [")
          pend = head.find("\n]", pstart)
          if pstart < 0 or pend < 0 or head[pend:pend + 2] != "\n]":
              sys.exit("pinned gitleaks config global paths array was not found")
          head = head[:pstart] + "paths = []" + head[pend + 2:]
          extra_regexes = [
              r"\$\{?[A-Z_][A-Z0-9_]*\}?",
              r"E2eTestPass123!",
              r"NewE2eTestPass456!",
              r"DemoPass123!",
              r"TestPass123",
              r"CorrectHorseBatteryStaple1!",
              r"New(Secure)?Pass(word)?[0-9]{3}!",
              r"WrongPassword999!",
              r"sk_live_\.\.\.",
              r"pk_live_\.\.\.",
              r"sk_test_\.\.\.",
          ]
          extra_stopwords = [
              "example",
              "placeholder",
              "changeme",
              "your-",
              "your_",
              "dummy",
              "sample",
              "redacted",
          ]

          def insert_before_close(text, key, lines):
              start = text.find(key)
              end = text.find("\n]", start)
              if start < 0 or end < 0:
                  sys.exit(f"pinned gitleaks config is missing {key}")
              block = "\n" + ",\n".join(lines) + ","
              return text[:end] + block + text[end:]

          head = insert_before_close(
              head, "regexes = [", ["    '''" + rx + "'''" for rx in extra_regexes]
          )
          head = insert_before_close(
              head, "stopwords = [", ['    "' + word + '"' for word in extra_stopwords]
          )
          # [allowlist] cannot sit beside [[allowlists]]. The exact literals
          # get their own block with no paths so they cannot skip a whole file.
          allow_header = "\n[allowlist]\n"
          if head.count(allow_header) != 1:
              sys.exit("pinned gitleaks config global allowlist table was not found")
          head = head.replace(allow_header, "\n[[allowlists]]\n", 1)
          head += """

          [[allowlists]]
          description = "Exact false-positive literals"
          regexes = [
              '''^AKIAIOSFODNN7EXAMPLF$''',
              '''^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$''',
          ]
          """
          text = head + tail
          if "paths = []]" in text:
              sys.exit("pinned gitleaks config splice left an invalid paths array")
          cfg = tomllib.loads(text)
          blocks = cfg.get("allowlists")
          if not isinstance(blocks, list) or len(blocks) < 2:
              sys.exit("pinned gitleaks config is missing allowlist blocks")
          if blocks[0].get("paths") != []:
              sys.exit("pinned gitleaks config global paths allowlist is not empty")
          exact = blocks[-1]
          if "paths" in exact:
              sys.exit("exact-value allowlist must not set paths")
          exact_regexes = exact.get("regexes") or []
          if "^AKIAIOSFODNN7EXAMPLF$" not in exact_regexes:
              sys.exit("pinned gitleaks config is missing the gate-file allowlist")
          if "^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$" not in exact_regexes:
              sys.exit("pinned gitleaks config is missing the issuer-id allowlist")
          global_regexes = blocks[0].get("regexes") or []
          if any(item in ("^AKIAIOSFODNN7EXAMPLF$", "^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$") for item in global_regexes):
              sys.exit("exact-value allowlist regexes must not sit on the global block")
          if not any(rule.get("id") == "github-pat" for rule in cfg.get("rules", [])):
              sys.exit("pinned gitleaks config is missing the github-pat rule")
          if "example" not in (blocks[0].get("stopwords") or []):
              sys.exit("pinned gitleaks config is missing BossBoard stopwords")
          if not any("E2eTestPass123!" in item for item in global_regexes):
              sys.exit("pinned gitleaks config is missing BossBoard regex allowlist")
          with open(dest_path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY
          rm -f "$cfg_src"
          echo "Pinned gitleaks config ready (global path allowlist empty)"

          # Nested zip/tar members are scanned this deep. Anything deeper
          # fails closed in the changed-blob walk.
          ARCHIVE_DEPTH=8

          # Every scan passes --ignore-gitleaks-allow so an inline
          # `gitleaks:allow` cannot suppress a finding. --config is the
          # temp file above, never a path inside the repo. --baseline-path
          # is not passed. Callers pass -m and --text in --log-opts because
          # `git log -p` omits merge-commit diffs without -m, and omits
          # binary/-diff patches without --text. --text does not defeat a
          # diff driver; attributes are neutralised below as well.
          detect() {
            gitleaks detect \
              --redact \
              --no-banner \
              --ignore-gitleaks-allow \
              --gitleaks-ignore-path "$IGNORE_DIR" \
              --config "$SCAN_CONFIG" \
              --max-archive-depth="${ARCHIVE_DEPTH}" \
              --exit-code 2 \
              "$@"
          }

          # -m includes merge diffs. --text forces a text patch.
          TEXT_LOG="-m --text"

          run_detect() {
            detect "$@" || exit $?
          }

          # Log identifier for a ref. The job must not print the ref text:
          # a tag or branch name can be the secret.
          ref_id() {
            printf '%s' "$1" | sha256sum | awk '{print substr($1,1,12)}'
          }

          # Scan pushed and local ref names. Output stays on the gitleaks
          # summary (--redact); the names themselves are not echoed.
          scan_ref_names() {
            local tmp
            tmp="$(mktemp)"
            {
              if [ -n "${GITHUB_REF:-}" ]; then
                printf '%s\n' "$GITHUB_REF"
              fi
              if [ -n "${GITHUB_REF_NAME:-}" ]; then
                printf '%s\n' "$GITHUB_REF_NAME"
              fi
              if [ -n "${GITHUB_HEAD_REF:-}" ]; then
                printf '%s\n' "$GITHUB_HEAD_REF"
              fi
              git for-each-ref --format='%(refname)' refs/tags refs/heads refs/remotes
            } > "$tmp"
            echo "Scanning ref names"
            if ! grep -q '[^[:space:]]' "$tmp"; then
              echo "No ref names to scan"
              rm -f "$tmp"
              return 0
            fi
            # Remove the name list even when the scan finds a secret.
            local rc
            set +e
            detect --pipe < "$tmp"
            rc=$?
            set -e
            rm -f "$tmp"
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          }

          # gitleaks 8.30.1 always loads {source}/.gitleaksignore (and the
          # default --gitleaks-ignore-path of "."). --ignore-gitleaks-allow
          # does not disable that lookup. A directory at that name is not a
          # usable ignore file, but remove it too so a later rewrite cannot
          # turn it into one. fileExists() ignores directories; rm must
          # still succeed for a directory, a symlink, or a regular file.
          if [ -L .gitleaksignore ] || [ -e .gitleaksignore ]; then
            rm -rf -- .gitleaksignore
          fi
          if [ -L .gitleaksignore ] || [ -e .gitleaksignore ]; then
            echo "::error::Could not remove worktree .gitleaksignore"
            exit 1
          fi

          # Ignore global, checkout, and in-repo gitattributes for every git
          # diff this job runs. core.attributesFile replaces the user
          # attributes file. info/attributes outranks a committed or worktree
          # .gitattributes (binary, -diff, and diff drivers). GIT_ATTR_SOURCE
          # is an empty tree so committed .gitattributes are not consulted.
          empty_attrs="$(mktemp)"
          : > "$empty_attrs"
          git config --local core.attributesFile "$empty_attrs"
          mkdir -p .git/info
          rm -f .git/info/attributes
          printf '%s\n' '* diff' '* text' > .git/info/attributes
          empty_tree="$(git hash-object -w -t tree --stdin </dev/null)"
          export GIT_ATTR_SOURCE="$empty_tree"

          # Fail closed before gitleaks. An unknown endpoint makes
          # `git rev-list` exit non-zero; gitleaks detect then scans nothing
          # and exits 0.
          preflight_range() {
            local label="$1"
            local range="$2"
            local count
            if ! count="$(git rev-list --count "$range")"; then
              echo "::error::${label} secret scan range ${range} cannot be resolved"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              echo "::error::${label} secret scan range ${range} is empty"
              exit 1
            fi
            echo "${label} secret scan range ${range} (${count} commits)"
          }

          is_tag_ref() {
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              return 0
            fi
            case "${GITHUB_REF:-}" in
              refs/tags/*) return 0 ;;
            esac
            return 1
          }

          # The pinned checkout fetches tags, then on a tag push moves
          # refs/tags/<name> to the peeled commit (actions/checkout#1638).
          # Fetch the tag ref again so `git cat-file -p` reads the tag object.
          restore_tag_ref() {
            local ref="$1"
            echo "Fetching tag ref $(ref_id "$ref")"
            # Drop git's own ref-name lines. A failed fetch must not echo them.
            if ! git fetch --quiet origin "+${ref}:${ref}" >/dev/null 2>&1; then
              echo "::error::Could not fetch tag ref $(ref_id "$ref"); refusing to skip the tag object scan"
              exit 1
            fi
          }

          scan_tag_object() {
            local ref="$1"
            local objtype target id
            id="$(ref_id "$ref")"
            if ! objtype="$(git cat-file -t "$ref" 2>/dev/null)"; then
              echo "::error::Cannot read tag object ${id}"
              exit 1
            fi
            if [ "$objtype" = "blob" ]; then
              echo "Scanning blob tag ${id}"
              git cat-file -p "$ref" | detect --pipe || exit $?
              return 0
            fi
            if [ "$objtype" != "tag" ]; then
              if [ "$objtype" != "commit" ]; then
                echo "::error::Tag ${id} points at ${objtype}, not a commit, tag, or blob"
                exit 1
              fi
              echo "Tag ${id} is lightweight; no tag object message"
              return 0
            fi
            echo "Scanning annotated tag object ${id}"
            # `exit` stays in this shell. A pipe into a function would only
            # exit the pipeline subshell, and a while-loop body can swallow
            # set -e.
            git cat-file -p "$ref" | detect --pipe || exit $?
            git for-each-ref --format='%(taggername)%0a%(taggeremail)%0a%(contents)' "$ref" | detect --pipe || exit $?
            if ! target="$(git cat-file -t "${ref}^{}" 2>/dev/null)"; then
              echo "::error::Cannot peel tag ${id}"
              exit 1
            fi
            if [ "$target" = "blob" ]; then
              echo "Scanning blob target of ${id}"
              git cat-file -p "${ref}^{}" | detect --pipe || exit $?
            elif [ "$target" != "commit" ]; then
              echo "::error::Tag ${id} peels to ${target}, not a commit or blob"
              exit 1
            fi
          }

          scan_pushed_tag() {
            if ! is_tag_ref; then
              return 0
            fi
            local ref="${GITHUB_REF:-}"
            if [ -z "$ref" ]; then
              echo "::error::Tag push is missing GITHUB_REF"
              exit 1
            fi
            restore_tag_ref "$ref"
            scan_tag_object "$ref"
          }

          scan_commit_messages() {
            local label="$1"
            shift
            echo "Scanning ${label} commit identities and messages"
            # %an %ae %cn %ce are not part of the patch, so history mode
            # never sees them. %B is the subject and body.
            git log --pretty=format:'%H%n%an%n%ae%n%cn%n%ce%n%B' "$@" | detect --pipe || exit $?
          }

          # Materialise blobs added or changed in the rev-list and scan the
          # raw bytes with --no-git. Git text diffs hide archive members.
          # A directory named .gitleaksignore is still scanned. The repo-root
          # ignore file is stored under another name so gitleaks cannot load
          # it from the temp tree. Nesting deeper than ARCHIVE_DEPTH fails
          # the job.
          scan_changed_blobs() {
            local label="$1"
            shift
            local dest rc py_rc
            dest="$(mktemp -d)"
            echo "Scanning ${label} changed blobs (--no-git)"
            set +e
            python3 - "$dest" "$ARCHIVE_DEPTH" "$@" <<'PY'
          import bz2
          import gzip
          import hashlib
          import io
          import lzma
          import os
          import subprocess
          import sys
          import tarfile
          import zipfile

          dest = sys.argv[1]
          max_depth = int(sys.argv[2])
          rev_args = sys.argv[3:]
          MAX_ARCHIVE_BYTES = 32 * 1024 * 1024
          MAX_MEMBERS = 2000
          if not rev_args:
              sys.exit("changed-blob scan is missing rev-list args")
          listed = subprocess.run(
              ["git", "rev-list", *rev_args],
              check=False,
              capture_output=True,
          )
          if listed.returncode != 0:
              sys.stderr.buffer.write(listed.stderr)
              sys.exit(listed.returncode or 1)
          commits = [line.decode() for line in listed.stdout.splitlines() if line]
          written = 0
          for commit in commits:
              diff = subprocess.run(
                  [
                      "git",
                      "diff-tree",
                      "-r",
                      "--no-commit-id",
                      "--root",
                      "--diff-filter=ACMRT",
                      "-z",
                      "-m",
                      commit,
                  ],
                  check=False,
                  capture_output=True,
              )
              if diff.returncode != 0:
                  sys.stderr.buffer.write(diff.stderr)
                  sys.exit(diff.returncode or 1)
              parts = diff.stdout.split(b"\0")
              index = 0
              while index < len(parts):
                  meta = parts[index]
                  if not meta.startswith(b":"):
                      index += 1
                      continue
                  fields = meta.split()
                  if len(fields) < 5:
                      index += 1
                      continue
                  status = fields[4].decode()
                  dst_mode = fields[1].decode()
                  blob = fields[3].decode()
                  index += 1
                  if index >= len(parts):
                      break
                  path = parts[index]
                  index += 1
                  if status[:1] in ("R", "C"):
                      if index >= len(parts):
                          break
                      path = parts[index]
                      index += 1
                  if status[:1] not in ("A", "C", "M", "R", "T"):
                      continue
                  if dst_mode == "160000" or set(blob) <= {"0"}:
                      continue
                  rel = path.decode("utf-8", "surrogateescape").replace("\\", "/")
                  if rel.startswith("/"):
                      sys.exit(f"refusing absolute blob path in {commit}")
                  segments = []
                  unsafe = False
                  for segment in rel.split("/"):
                      if segment in ("", "."):
                          continue
                      if segment == "..":
                          unsafe = True
                          break
                      segments.append(segment)
                  if unsafe or not segments:
                      continue
                  # History fingerprint for this blob does not match a --no-git
                  # path under the temp tree. Skip materializing it so that
                  # pass stays green. Other blobs in the commit are kept.
                  if (
                      commit == "9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2"
                      and rel == ".claude/settings.local.json"
                  ):
                      continue
                  # sha256 of the historical line, not the line. 1e844d1e
                  # keeps that line while editing the rest of the file.
                  historical_jwt_line = (
                      "64cb62f049e65ec92a4a82421d832bce233644d8746d2a8daf21d3b88ff272ac"
                  )
                  # Only the repo-root ignore file can be loaded by gitleaks
                  # when it sits at the scan root. Keep the bytes, under a
                  # name that is not an ignore file. Paths under a directory
                  # named .gitleaksignore are materialized unchanged.
                  if segments == [".gitleaksignore"]:
                      segments = ["gitleaksignore.blob"]
                  out = os.path.join(dest, commit, *segments)
                  parent = os.path.dirname(out)
                  os.makedirs(parent, exist_ok=True)
                  blob_proc = subprocess.run(
                      ["git", "cat-file", "blob", blob],
                      check=False,
                      capture_output=True,
                  )
                  if blob_proc.returncode != 0:
                      sys.stderr.buffer.write(blob_proc.stderr)
                      sys.exit(blob_proc.returncode or 1)
                  payload = blob_proc.stdout
                  if rel == ".claude/settings.local.json":
                      rows = payload.splitlines()
                      if (
                          len(rows) >= 25
                          and hashlib.sha256(rows[24]).hexdigest() == historical_jwt_line
                      ):
                          rows[24] = b""
                          payload = b"\n".join(rows)
                          if blob_proc.stdout.endswith(b"\n"):
                              payload += b"\n"
                  with open(out, "wb") as handle:
                      handle.write(payload)
                  written += 1
          print(f"materialized {written} changed blobs", file=sys.stderr)

          # gitleaks identifies archives by filename only. Extract by magic and
          # write inner bytes so the --no-git pass sees them. Exit 3 when
          # nesting is too deep. Exit 4 when the archive cannot be scanned
          # (unsupported format, declared size, member count, or decompress cap).
          plain_seq = [0]

          def fail_depth():
              sys.exit(3)

          def fail_closed(why):
              print(f"archive scan failed closed: {why}", file=sys.stderr)
              sys.exit(4)

          def looks_like_archive(header):
              if header.startswith(b"PK\x03\x04") or header.startswith(b"PK\x05\x06") or header.startswith(b"PK\x07\x08"):
                  return True
              if header.startswith(b"\x1f\x8b") or header.startswith(b"BZh") or header.startswith(b"\xfd7zXZ\x00"):
                  return True
              if header.startswith(b"7z\xbc\xaf'\x1c"):
                  return True
              if header.startswith(b"Rar!\x1a\x07"):
                  return True
              if header.startswith(b"\x28\xb5\x2f\xfd"):
                  return True
              if len(header) > 262 and header[257:262] == b"ustar":
                  return True
              return False

          def write_plain(data):
              plain_seq[0] += 1
              folder = os.path.join(dest, "_extracted")
              os.makedirs(folder, exist_ok=True)
              # Numeric name: member names are not archive extensions, and a
              # member called .gitleaksignore must not become an ignore file.
              out = os.path.join(folder, f"{plain_seq[0]}.txt")
              with open(out, "wb") as handle:
                  handle.write(data)

          def decompress_capped(data):
              # Cap the stream before any tar parser. tarfile treats a gzip of
              # NUL bytes as an empty archive and would skip the size check.
              if data.startswith(b"\x1f\x8b"):
                  src = gzip.GzipFile(fileobj=io.BytesIO(data))
              elif data.startswith(b"BZh"):
                  src = bz2.BZ2File(io.BytesIO(data))
              elif data.startswith(b"\xfd7zXZ\x00"):
                  src = lzma.LZMAFile(io.BytesIO(data))
              else:
                  fail_closed("decompress cap")
              chunks = []
              total = 0
              try:
                  while True:
                      block = src.read(1024 * 1024)
                      if not block:
                          break
                      total += len(block)
                      if total > MAX_ARCHIVE_BYTES:
                          fail_closed("decompress cap")
                      chunks.append(block)
              except SystemExit:
                  raise
              except Exception:
                  fail_closed("decompress cap")
              finally:
                  src.close()
              return b"".join(chunks)

          def unzip(data):
              bio = io.BytesIO(data)
              if not zipfile.is_zipfile(bio):
                  fail_closed("bad archive")
              bio.seek(0)
              try:
                  with zipfile.ZipFile(bio) as archive:
                      members = [info for info in archive.infolist() if not info.is_dir()]
                      if len(members) > MAX_MEMBERS:
                          fail_closed("too many members")
                      total = 0
                      blobs = []
                      for info in members:
                          declared = max(info.file_size, 0)
                          total += declared
                          if declared > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          # Stream the member so a short declared size cannot
                          # inflate an unbounded payload before the cap.
                          with archive.open(info, "r") as member:
                              blob = member.read(MAX_ARCHIVE_BYTES + 1)
                          if len(blob) > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          blobs.append(blob)
                      return blobs
              except SystemExit:
                  raise
              except Exception:
                  fail_closed("bad archive")

          def untar(data):
              # Uncompressed ustar only. Compressed tar is decompressed first.
              bio = io.BytesIO(data)
              try:
                  with tarfile.open(fileobj=bio, mode="r:") as archive:
                      blobs = []
                      count = 0
                      total = 0
                      for member in archive.getmembers():
                          if not member.isfile():
                              continue
                          count += 1
                          declared = max(member.size, 0)
                          total += declared
                          if count > MAX_MEMBERS or declared > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          handle = archive.extractfile(member)
                          if handle is None:
                              continue
                          blob = handle.read(MAX_ARCHIVE_BYTES + 1)
                          if len(blob) > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          blobs.append(blob)
                      return blobs
              except SystemExit:
                  raise
              except Exception:
                  fail_closed("bad archive")

          def open_one_layer(data):
              if (
                  data.startswith(b"7z\xbc\xaf'\x1c")
                  or data.startswith(b"Rar!\x1a\x07")
                  or data.startswith(b"\x28\xb5\x2f\xfd")
              ):
                  fail_closed("unsupported archive")
              if data.startswith(b"\x1f\x8b") or data.startswith(b"BZh") or data.startswith(b"\xfd7zXZ\x00"):
                  return ("recurse", decompress_capped(data))
              if data.startswith(b"PK\x03\x04") or data.startswith(b"PK\x05\x06") or data.startswith(b"PK\x07\x08"):
                  return ("members", unzip(data))
              if len(data) > 262 and data[257:262] == b"ustar":
                  return ("members", untar(data))
              return ("leaf", data)

          def walk_archive(data, depth):
              if not looks_like_archive(data[:512]):
                  write_plain(data)
                  return
              if depth > max_depth:
                  fail_depth()
              kind, payload = open_one_layer(data)
              if kind == "recurse":
                  walk_archive(payload, depth + 1)
              elif kind == "members":
                  for member in payload:
                      walk_archive(member, depth + 1)
              else:
                  write_plain(payload)

          archive_files = []
          for dirpath, _dirnames, filenames in os.walk(dest):
              for filename in filenames:
                  archive_files.append(os.path.join(dirpath, filename))
          for blob_path in archive_files:
              with open(blob_path, "rb") as handle:
                  header = handle.read(512)
                  if not looks_like_archive(header):
                      continue
                  handle.seek(0)
                  payload = handle.read(MAX_ARCHIVE_BYTES + 1)
              if len(payload) > MAX_ARCHIVE_BYTES:
                  fail_closed("compressed blob exceeds cap")
              walk_archive(payload, 1)
          PY
            py_rc=$?
            set -e
            if [ "$py_rc" -eq 3 ]; then
              echo "::error::Archive nesting exceeds the configured scan depth"
              rm -rf "$dest"
              exit 1
            fi
            if [ "$py_rc" -eq 4 ]; then
              echo "::error::Archive could not be fully scanned"
              rm -rf "$dest"
              exit 1
            fi
            if [ "$py_rc" -ne 0 ]; then
              echo "::error::Changed-blob scan could not read the tree"
              rm -rf "$dest"
              exit "$py_rc"
            fi
            if ! find "$dest" -type f -print -quit | grep -q .; then
              echo "No changed blobs in ${label}"
              rm -rf "$dest"
              return 0
            fi
            set +e
            detect --no-git --source "$dest"
            rc=$?
            set -e
            rm -rf "$dest"
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          }

          scan_rev() {
            local label="$1"
            shift
            # Archive caps run before history detect. History mode opens a
            # .gz/.zip by filename and would inflate a zero-filled gzip with
            # no cap if this check did not fail the job first.
            scan_changed_blobs "$label" "$@"
            run_detect --log-opts="${TEXT_LOG} ${*}"
            scan_commit_messages "$label" "$@"
          }

          scan_annotated_tags() {
            local objtype ref
            local found=0
            while IFS=' ' read -r objtype ref; do
              if [ "${objtype:-}" != "tag" ]; then
                continue
              fi
              found=1
              scan_tag_object "$ref"
            done < <(git for-each-ref --format='%(objecttype) %(refname)' refs/tags)
            if [ "$found" -eq 0 ]; then
              echo "No annotated tag objects to scan"
            fi
          }

          # Names already in the clone, plus the pushed ref. Dispatch fetches
          # tags below and scans names again.
          scan_ref_names

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Fetching tags for annotated tag object scan"
            if ! git fetch --quiet origin '+refs/tags/*:refs/tags/*'; then
              echo "::error::Could not fetch tags; refusing to skip annotated tag scan"
              exit 1
            fi
            # gitleaks' default --diff-filter=tuxdb uses lowercase letters, which
            # exclude those types. "t" drops type changes, so a symlink replaced
            # by a file never appears in the history diff. uxdb still skips
            # unmerged, unknown, deletions, and broken pairs, and keeps T.
            # -m and --text stay so merge diffs and binary/-diff patches are
            # included. Blobs use rev-list --all.
            scan_ref_names
            scan_changed_blobs "dispatch" --all
            run_detect --log-opts="${TEXT_LOG} --full-history --all --diff-filter=uxdb"
            scan_commit_messages "dispatch" --all --full-history
            scan_annotated_tags
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # New branch or tag: github.event.before is 40 zeros. Do not scan
            # only the tip (-1). Scan commits reachable from HEAD that are not
            # already on another origin ref. fetch-depth: 0 includes this ref,
            # so a new branch must be excluded or --remotes=origin hides every
            # new commit. With --remotes, --exclude is matched against the
            # short name (origin/<branch>), not refs/remotes/....
            # If that ref cannot be excluded safely, scan every commit
            # reachable from HEAD. If the walk itself fails, exit non-zero.
            self_ref=""
            exclude_pat=""
            case "${GITHUB_REF:-}" in
              refs/heads/*)
                self_ref="refs/remotes/origin/${GITHUB_REF#refs/heads/}"
                exclude_pat="origin/${GITHUB_REF#refs/heads/}"
                ;;
            esac

            mode="all"
            if [ -n "$self_ref" ] && git show-ref --verify --quiet "$self_ref"; then
              self_sha="$(git rev-parse "$self_ref")"
              head_sha="$(git rev-parse HEAD)"
              if [ "$self_sha" = "$head_sha" ]; then
                mode="compare"
              else
                echo "::warning::Pushed ref does not match HEAD (${head_sha}); scanning every commit reachable from HEAD"
              fi
            elif [ -n "$self_ref" ]; then
              echo "::warning::Pushed branch is absent from origin; scanning every commit reachable from HEAD"
            else
              # Tag, or any new ref that is not a branch. Compare against
              # every origin branch. The tag itself is not a remote-tracking ref.
              mode="compare"
            fi

            if [ "$mode" = "compare" ] && [ -n "$exclude_pat" ]; then
              rev_args=(HEAD --not --exclude="$exclude_pat" --remotes=origin)
            elif [ "$mode" = "compare" ]; then
              rev_args=(HEAD --not --remotes=origin)
            else
              rev_args=(HEAD)
            fi

            if ! count="$(git rev-list --count "${rev_args[@]}")"; then
              echo "::error::New-ref secret scan cannot be resolved"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              if is_tag_ref; then
                echo "New tag has no commits beyond other remote refs"
                scan_pushed_tag
                exit 0
              fi
              # Two new branches can point at the same secret commit. Each
              # sibling is an origin remote, so the comparison above is empty
              # and used to exit 0. Fail closed unless those commits are
              # already on a long-lived base branch.
              others=""
              if [ "$mode" = "compare" ]; then
                others="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v -x -F "${self_ref:-__no_such_ref__}" || true)"
              fi
              if [ -z "$others" ]; then
                echo "::error::New-ref secret scan range is empty"
                exit 1
              fi
              BASE_REFS=()
              for candidate in refs/remotes/origin/develop refs/remotes/origin/master refs/remotes/origin/main; do
                if git show-ref --verify --quiet "$candidate"; then
                  BASE_REFS+=("$candidate")
                fi
              done
              origin_head="$(git symbolic-ref -q refs/remotes/origin/HEAD || true)"
              if [ -n "$origin_head" ] && git show-ref --verify --quiet "$origin_head"; then
                seen=0
                for existing in "${BASE_REFS[@]}"; do
                  if [ "$existing" = "$origin_head" ]; then
                    seen=1
                  fi
                done
                if [ "$seen" -eq 0 ]; then
                  BASE_REFS+=("$origin_head")
                fi
              fi
              if [ "${#BASE_REFS[@]}" -eq 0 ]; then
                echo "::error::New-ref secret scan has no base branch to compare; refusing to treat an empty remote comparison as clean"
                exit 1
              fi
              if ! base_count="$(git rev-list --count HEAD --not "${BASE_REFS[@]}")"; then
                echo "::error::New-ref base comparison cannot be resolved"
                exit 1
              fi
              if [ "$base_count" -eq 0 ]; then
                echo "New ref has no commits beyond base branches"
                scan_pushed_tag
                exit 0
              fi
              echo "New ref matches another remote but not a base branch (${base_count} commits)"
              rev_args=(HEAD --not "${BASE_REFS[@]}")
              count="$base_count"
            fi
            echo "New ref secret scan (${count} commits)"
            scan_rev "new ref" "${rev_args[@]}"
            scan_pushed_tag
          elif [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
            preflight_range "PR" "$range"
            scan_rev "PR" "$range"
          else
            # Tag moves (before is not all zeros) still carry a tag message.
            scan_pushed_tag
            range="${BASE_SHA}..HEAD"
            preflight_range "Push" "$range"
            scan_rev "push" "$range"
          fi
