name: secrets-scan

# Prevention control alongside secret-scan.yml. gitleaks fails the job on
# any finding. The job runs the checksummed 8.30.1 binary (the gitleaks-action
# download is not checksummed). Push and pull_request scan added lines in
# the commit range (--redact, exit code 2 on leaks). workflow_dispatch scans
# full history and stays red until history is rewritten. This job does not
# rewrite git history.
#
# BossBoard does not ship Cortex-Forge's secret-rule pytest fixtures, so
# those steps are not copied. Config and allowlists stay in .gitleaks.toml.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # pull_request checkout HEAD is the merge commit. Its first parent is
          # the base, so --first-parent base..HEAD is an empty range. Scan the
          # PR head SHA from the event instead.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 2
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 2 --log-opts="-1"
          elif [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
            count="$(git rev-list --count "$range")"
            if [ "$count" -eq 0 ]; then
              echo "::error::PR secret scan range ${range} is empty"
              exit 1
            fi
            echo "PR secret scan range ${range} (${count} commits)"
            gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 2 \
              --log-opts="$range"
          else
            gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 2 \
              --log-opts="${BASE_SHA}..HEAD"
          fi
