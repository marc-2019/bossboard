name: secrets-scan

# Prevention control alongside secret-scan.yml. gitleaks fails the job on
# any finding. The job runs the checksummed 8.30.1 binary (the gitleaks-action
# download is not checksummed). Push and pull_request scan added lines in
# the commit range (--redact, --ignore-gitleaks-allow, exit code 2 on leaks).
# An unresolved before..HEAD range fails the job; gitleaks itself exits 0
# when that range cannot be resolved. workflow_dispatch scans full history,
# including merge-commit diffs, and stays red until history is rewritten.
# This job does not rewrite git history.
#
# gitleaks 8.30.1 loads {source}/.gitleaksignore even with
# --ignore-gitleaks-allow, and `git log -p` drops patches for paths marked
# binary or -diff. The job removes a worktree ignore file or directory and
# neutralises global, checkout, and in-repo gitattributes before detect.
# History mode scans patch hunks only, so author, committer, and commit
# message text are piped separately. Annotated tag objects are not commits:
# a tag push scans the tag object (tagger and message) and, when the tag
# peels to a blob, that blob. workflow_dispatch scans every annotated tag
# object. The pinned checkout rewrites the pushed annotated tag ref to the
# peeled commit, so that ref is fetched again before the tag object is read.
# Ref names are scanned and are never written to the job log: a lightweight
# tag or branch whose name is a secret has no commit to fail on, and echoing
# the name would publish it.
#
# Known limits: git notes are not scanned. A rename-only history patch omits
# the file body when rename detection is on; the changed-blob scan still
# reads both sides of an add, modify, type change, rename, copy, or
# deletion when that commit is in the range. Submodule gitlinks (mode
# 160000) are not traversed. diff-tree writes the preimage mode as
# ":160000". A record whose new side is a gitlink or symlink still reads
# the old blob when that side is a regular file. Raw brotli has no magic
# the walker can recognise, so a brotli stream is an accepted limit and
# is not decompressed. workflow_dispatch full history also sees the
# introducing commit.
#
# The scan does not read .gitleaks.toml, a baseline, or allowlists from the
# commit under test. Rules come from the checksum-pinned gitleaks v8.30.1
# config with the global path allowlist emptied (that list skips images,
# office/bin extensions, and gitleaks.toml, and `extend useDefault = true`
# keeps it). BossBoard's narrow regex and stopword allowlist is appended
# in this workflow. Two exact false-positive literals live in their own
# [[allowlists]] block with no paths, because a path entry is a whole-file
# skip. The file is written outside the worktree and passed with --config.
# Changed blobs are also scanned with --no-git.
#
# gitleaks 8.30.1 treats a file as an archive only when the filename matches
# an archive extension. A deflated zip named notes.bin or notes.png, a zip
# member named inner.bin, gzip named notes.bin, and a .gz whose payload is
# a zip are not unpacked by gitleaks. The changed-blob walk extracts by
# magic and writes the inner bytes for that --no-git pass. gzip, bzip2, and
# xz use an incremental decoder with a 32MiB cap before any tar parser.
# Bytes the decoder leaves in unused_data are scanned too, so a second
# stream concatenated after bzip2 or xz is not dropped. A blob larger than
# 32MiB fails closed before it is read, even when the first 32MiB has no
# signature. Exceeding the cap fails the job (a gzip of zeros is an empty
# tar if the cap is not applied first, and gitleaks would inflate it with
# no cap). That check runs before the history detect, because history mode
# also opens archives by filename and has no byte cap.
# Zip bytes that are not a member body are scanned: the archive comment,
# per-file central-directory comments and extra fields, local extra fields,
# gaps between local entries and the central directory, and bytes after
# the end-of-central-directory record. Tar member names, link targets, pax
# headers, non-zero 512-byte block padding, and bytes after the last member
# are scanned. Gzip FEXTRA, FNAME, and FCOMMENT are scanned. zlib and
# lzma-alone are decoded at offset 0 and again inside tar, cpio, and ar
# member bodies, including after leading NUL bytes. newc, odc cpio, and
# ar archives are unpacked. A nonempty symbol table (`/`, `/SYM64/`) or
# GNU long-name table (`//`) is scanned and counts toward the member and
# byte caps; an empty one is ignored. Every ar, ustar, newc, and odc
# member header is written in full, including bytes that are not the
# parsed name or body (ar mtime/uid/gid/mode and the name field after a
# NUL, ustar uname/gname/prefix, cpio header fields). Zip local and
# central headers are written the same way. Those header slices are not
# extra members, so the 2000-member boundary is unchanged. Every tar
# member with a non-zero size is scanned, whatever its typeflag. base64, base64url, and hex candidates
# are decoded and the walker runs on the result, including a second
# encoding layer and base64 wrapped on short lines. A whole-file UTF-16
# ASCII blob is decoded before the secret regex runs. Paths are never
# dropped: a '..' component, a backslash, or an absolute name is stored
# under a generated extensionless name and the bytes are still scanned.
# Each staged copy sits in a directory named with the side, a counter,
# and the blob sha, so one repository path cannot overwrite another.
# Identical blob shas are still written once.
# Every annotated tag in a chain is read: the message text is scanned and
# the message bytes go through the walker, and a blob target does too.
# Raw commit objects in the range are scanned so an extra header is
# visible when the diff is empty. 7z, rar, zstd, and framed lz4 are
# recognised and fail closed until they are actually scanned. A declared
# uncompressed size over 32MiB, more than 2000 members in one archive,
# more than 10000 expanded members in total, more than 32MiB of expanded
# bytes, or nesting deeper than 8 fails the job. Zip, gzip, bzip2, xz,
# and a zip end-of-central-directory record count wherever they sit in
# the blob, so a leading NUL is not a clean scan. A deflate member whose
# stream continues past the declared uncompressed size fails the job
# even when the CRC matches that short prefix. This is not complete
# coverage: 7z, rar, zstd, and framed lz4 are refused, not extracted, and
# raw brotli is not detected.
#
# One expired historical JWT (rule jwt, .claude/settings.local.json:25,
# commit 9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2, scrubbed in 6db9dcb) is
# suppressed only by that fingerprint in the temp ignore file this job
# writes. That blob is not materialized. The same line is still present in
# 1e844d1e, which edits the file without touching the line, so history mode
# does not see it and --no-git would. That line is dropped only when its
# sha256 matches; the rest of the file is still scanned. There is no path
# or commit allowlist, and the token is not stored in this file.
#
# BossBoard does not ship Cortex-Forge's secret-rule pytest fixtures, so
# those steps are not copied. Local scans still use the repo .gitleaks.toml
# via scripts/scan-secrets.sh; this job does not.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # pull_request checkout HEAD is the synthetic merge commit
          # (refs/pull/<n>/merge). Its first parent is the PR base and its
          # second parent is the PR head. `git log --first-parent base..HEAD`
          # follows only that first parent, so the range contains the merge
          # commit and none of the PR-branch commits. Scan
          # base..pull_request.head.sha, which is those PR commits.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          unset GITLEAKS_CONFIG || true
          unset GITLEAKS_CONFIG_TOML || true

          # Upstream v8.30.1 rules, checksum-pinned. The global path
          # allowlist is emptied so png/pdf/bin/gitleaks.toml are scanned.
          # Per-rule allowlists stay. BossBoard regexes and stopwords are
          # appended here and are not read from the commit under test.
          cfg_src="$(mktemp)"
          SCAN_CONFIG="$(mktemp)"
          IGNORE_DIR="$(mktemp -d)"
          # History fingerprint only. The worktree .gitleaksignore is removed
          # below, so this temp file is the only ignore list the job loads.
          # The token itself is not written here.
          printf '%s\n' '9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2:.claude/settings.local.json:jwt:25' > "${IGNORE_DIR}/.gitleaksignore"
          downloaded=0
          for _attempt in 1 2 3; do
            if curl -fsSL -o "$cfg_src" https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml; then
              downloaded=1
              break
            fi
            sleep 2
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "::error::Could not download the pinned gitleaks config"
            exit 1
          fi
          echo "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf  ${cfg_src}" | sha256sum -c -
          python3 - "$cfg_src" "$SCAN_CONFIG" <<'PY'
          import sys
          import tomllib

          src_path, dest_path = sys.argv[1], sys.argv[2]
          with open(src_path, encoding="utf-8") as handle:
              src = handle.read()
          marker = "\n[[rules]]\n"
          idx = src.find(marker)
          if idx < 0:
              sys.exit("pinned gitleaks config has no rules table")
          head, tail = src[:idx], src[idx:]
          pstart = head.find("paths = [")
          pend = head.find("\n]", pstart)
          if pstart < 0 or pend < 0 or head[pend:pend + 2] != "\n]":
              sys.exit("pinned gitleaks config global paths array was not found")
          head = head[:pstart] + "paths = []" + head[pend + 2:]
          extra_regexes = [
              r"\$\{?[A-Z_][A-Z0-9_]*\}?",
              r"E2eTestPass123!",
              r"NewE2eTestPass456!",
              r"DemoPass123!",
              r"TestPass123",
              r"CorrectHorseBatteryStaple1!",
              r"New(Secure)?Pass(word)?[0-9]{3}!",
              r"WrongPassword999!",
              r"sk_live_\.\.\.",
              r"pk_live_\.\.\.",
              r"sk_test_\.\.\.",
          ]
          extra_stopwords = [
              "example",
              "placeholder",
              "changeme",
              "your-",
              "your_",
              "dummy",
              "sample",
              "redacted",
          ]

          def insert_before_close(text, key, lines):
              start = text.find(key)
              end = text.find("\n]", start)
              if start < 0 or end < 0:
                  sys.exit(f"pinned gitleaks config is missing {key}")
              block = "\n" + ",\n".join(lines) + ","
              return text[:end] + block + text[end:]

          head = insert_before_close(
              head, "regexes = [", ["    '''" + rx + "'''" for rx in extra_regexes]
          )
          head = insert_before_close(
              head, "stopwords = [", ['    "' + word + '"' for word in extra_stopwords]
          )
          # [allowlist] cannot sit beside [[allowlists]]. The exact literals
          # get their own block with no paths so they cannot skip a whole file.
          allow_header = "\n[allowlist]\n"
          if head.count(allow_header) != 1:
              sys.exit("pinned gitleaks config global allowlist table was not found")
          head = head.replace(allow_header, "\n[[allowlists]]\n", 1)
          head += """

          [[allowlists]]
          description = "Exact false-positive literals"
          regexes = [
              '''^AKIAIOSFODNN7EXAMPLF$''',
              '''^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$''',
          ]
          """
          text = head + tail
          if "paths = []]" in text:
              sys.exit("pinned gitleaks config splice left an invalid paths array")
          cfg = tomllib.loads(text)
          blocks = cfg.get("allowlists")
          if not isinstance(blocks, list) or len(blocks) < 2:
              sys.exit("pinned gitleaks config is missing allowlist blocks")
          if blocks[0].get("paths") != []:
              sys.exit("pinned gitleaks config global paths allowlist is not empty")
          exact = blocks[-1]
          if "paths" in exact:
              sys.exit("exact-value allowlist must not set paths")
          exact_regexes = exact.get("regexes") or []
          if "^AKIAIOSFODNN7EXAMPLF$" not in exact_regexes:
              sys.exit("pinned gitleaks config is missing the gate-file allowlist")
          if "^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$" not in exact_regexes:
              sys.exit("pinned gitleaks config is missing the issuer-id allowlist")
          global_regexes = blocks[0].get("regexes") or []
          if any(item in ("^AKIAIOSFODNN7EXAMPLF$", "^69a6de88-9efd-47e3-e053-5b8c7c11a4d1$") for item in global_regexes):
              sys.exit("exact-value allowlist regexes must not sit on the global block")
          if not any(rule.get("id") == "github-pat" for rule in cfg.get("rules", [])):
              sys.exit("pinned gitleaks config is missing the github-pat rule")
          if "example" not in (blocks[0].get("stopwords") or []):
              sys.exit("pinned gitleaks config is missing BossBoard stopwords")
          if not any("E2eTestPass123!" in item for item in global_regexes):
              sys.exit("pinned gitleaks config is missing BossBoard regex allowlist")
          with open(dest_path, "w", encoding="utf-8") as handle:
              handle.write(text)
          PY
          rm -f "$cfg_src"
          echo "Pinned gitleaks config ready (global path allowlist empty)"

          # Nested zip/tar members are scanned this deep. Anything deeper
          # fails closed in the changed-blob walk.
          ARCHIVE_DEPTH=8

          # Every scan passes --ignore-gitleaks-allow so an inline
          # `gitleaks:allow` cannot suppress a finding. --config is the
          # temp file above, never a path inside the repo. --baseline-path
          # is not passed. Callers pass -m and --text in --log-opts because
          # `git log -p` omits merge-commit diffs without -m, and omits
          # binary/-diff patches without --text. --text does not defeat a
          # diff driver; attributes are neutralised below as well.
          detect() {
            gitleaks detect \
              --redact \
              --no-banner \
              --ignore-gitleaks-allow \
              --gitleaks-ignore-path "$IGNORE_DIR" \
              --config "$SCAN_CONFIG" \
              --max-archive-depth="${ARCHIVE_DEPTH}" \
              --exit-code 2 \
              "$@"
          }

          # -m includes merge diffs. --text forces a text patch.
          TEXT_LOG="-m --text"

          run_detect() {
            detect "$@" || exit $?
          }

          # Log identifier for a ref. The job must not print the ref text:
          # a tag or branch name can be the secret.
          ref_id() {
            printf '%s' "$1" | sha256sum | awk '{print substr($1,1,12)}'
          }

          # Scan pushed and local ref names. Output stays on the gitleaks
          # summary (--redact); the names themselves are not echoed.
          scan_ref_names() {
            local tmp
            tmp="$(mktemp)"
            {
              if [ -n "${GITHUB_REF:-}" ]; then
                printf '%s\n' "$GITHUB_REF"
              fi
              if [ -n "${GITHUB_REF_NAME:-}" ]; then
                printf '%s\n' "$GITHUB_REF_NAME"
              fi
              if [ -n "${GITHUB_HEAD_REF:-}" ]; then
                printf '%s\n' "$GITHUB_HEAD_REF"
              fi
              git for-each-ref --format='%(refname)' refs/tags refs/heads refs/remotes
            } > "$tmp"
            echo "Scanning ref names"
            if ! grep -q '[^[:space:]]' "$tmp"; then
              echo "No ref names to scan"
              rm -f "$tmp"
              return 0
            fi
            # Remove the name list even when the scan finds a secret.
            local rc
            set +e
            detect --pipe < "$tmp"
            rc=$?
            set -e
            rm -f "$tmp"
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          }

          # gitleaks 8.30.1 always loads {source}/.gitleaksignore (and the
          # default --gitleaks-ignore-path of "."). --ignore-gitleaks-allow
          # does not disable that lookup. A directory at that name is not a
          # usable ignore file, but remove it too so a later rewrite cannot
          # turn it into one. fileExists() ignores directories; rm must
          # still succeed for a directory, a symlink, or a regular file.
          if [ -L .gitleaksignore ] || [ -e .gitleaksignore ]; then
            rm -rf -- .gitleaksignore
          fi
          if [ -L .gitleaksignore ] || [ -e .gitleaksignore ]; then
            echo "::error::Could not remove worktree .gitleaksignore"
            exit 1
          fi

          # Ignore global, checkout, and in-repo gitattributes for every git
          # diff this job runs. core.attributesFile replaces the user
          # attributes file. info/attributes outranks a committed or worktree
          # .gitattributes (binary, -diff, and diff drivers). GIT_ATTR_SOURCE
          # is an empty tree so committed .gitattributes are not consulted.
          empty_attrs="$(mktemp)"
          : > "$empty_attrs"
          git config --local core.attributesFile "$empty_attrs"
          mkdir -p .git/info
          rm -f .git/info/attributes
          printf '%s\n' '* diff' '* text' > .git/info/attributes
          empty_tree="$(git hash-object -w -t tree --stdin </dev/null)"
          export GIT_ATTR_SOURCE="$empty_tree"

          # Fail closed before gitleaks. An unknown endpoint makes
          # `git rev-list` exit non-zero; gitleaks detect then scans nothing
          # and exits 0.
          preflight_range() {
            local label="$1"
            local range="$2"
            local count
            if ! count="$(git rev-list --count "$range")"; then
              echo "::error::${label} secret scan range ${range} cannot be resolved"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              echo "::error::${label} secret scan range ${range} is empty"
              exit 1
            fi
            echo "${label} secret scan range ${range} (${count} commits)"
          }

          is_tag_ref() {
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              return 0
            fi
            case "${GITHUB_REF:-}" in
              refs/tags/*) return 0 ;;
            esac
            return 1
          }

          # The pinned checkout fetches tags, then on a tag push moves
          # refs/tags/<name> to the peeled commit (actions/checkout#1638).
          # Fetch the tag ref again so `git cat-file -p` reads the tag object.
          restore_tag_ref() {
            local ref="$1"
            echo "Fetching tag ref $(ref_id "$ref")"
            # Drop git's own ref-name lines. A failed fetch must not echo them.
            if ! git fetch --quiet origin "+${ref}:${ref}" >/dev/null 2>&1; then
              echo "::error::Could not fetch tag ref $(ref_id "$ref"); refusing to skip the tag object scan"
              exit 1
            fi
          }

          scan_tag_object() {
            local ref="$1"
            local objtype id raw msg meta next_type next_obj depth
            depth=0
            while true; do
              depth=$((depth + 1))
              if [ "$depth" -gt 8 ]; then
                echo "::error::Annotated tag chain exceeds the configured scan depth"
                exit 1
              fi
              id="$(ref_id "$ref")"
              if ! objtype="$(git cat-file -t "$ref" 2>/dev/null)"; then
                echo "::error::Cannot read tag object ${id}"
                exit 1
              fi
              if [ "$objtype" = "blob" ]; then
                echo "Scanning blob tag ${id}"
                # Same walker as changed blobs. A pipe into gitleaks does not
                # decompress a gzip or zip target.
                git cat-file -p "$ref" | scan_piped_blob
                return 0
              fi
              if [ "$objtype" != "tag" ]; then
                if [ "$objtype" != "commit" ]; then
                  echo "::error::Tag ${id} points at ${objtype}, not a commit, tag, or blob"
                  exit 1
                fi
                if [ "$depth" -eq 1 ]; then
                  echo "Tag ${id} is lightweight; no tag object message"
                fi
                return 0
              fi
              echo "Scanning annotated tag object ${id}"
              raw="$(mktemp)"
              msg="$(mktemp)"
              git cat-file -p "$ref" > "$raw"
              # `exit` stays in this shell. A pipe into a function would only
              # exit the pipeline subshell, and a while-loop body can swallow
              # set -e.
              detect --pipe < "$raw" || exit $?
              if git show-ref --verify --quiet "$ref"; then
                git for-each-ref --format='%(taggername)%0a%(taggeremail)%0a%(contents)' "$ref" | detect --pipe || exit $?
              fi
              meta="$(python3 - "$raw" "$msg" <<'PY'
          import pathlib
          import sys

          data = pathlib.Path(sys.argv[1]).read_bytes()
          head, _sep, message = data.partition(b"\n\n")
          pathlib.Path(sys.argv[2]).write_bytes(message)
          obj = ""
          typ = ""
          for line in head.split(b"\n"):
              if line.startswith(b"object "):
                  obj = line[7:].decode()
              elif line.startswith(b"type "):
                  typ = line[5:].decode()
          if not obj or not typ:
              sys.exit("tag object is missing object or type")
          sys.stdout.write(typ + "\n" + obj + "\n")
          PY
          )"
              # The message may be gzip or another archive. detect --pipe does
              # not unpack it.
              scan_piped_blob < "$msg"
              rm -f "$raw" "$msg"
              next_type="${meta%%$'\n'*}"
              next_obj="${meta#*$'\n'}"
              next_obj="${next_obj%%$'\n'*}"
              if [ "$next_type" = "tag" ]; then
                ref="$next_obj"
                continue
              fi
              if [ "$next_type" = "blob" ]; then
                echo "Scanning blob target of ${id}"
                git cat-file -p "$next_obj" | scan_piped_blob
              elif [ "$next_type" != "commit" ]; then
                echo "::error::Tag ${id} peels to ${next_type}, not a commit, tag, or blob"
                exit 1
              fi
              return 0
            done
          }

          scan_pushed_tag() {
            if ! is_tag_ref; then
              return 0
            fi
            local ref="${GITHUB_REF:-}"
            if [ -z "$ref" ]; then
              echo "::error::Tag push is missing GITHUB_REF"
              exit 1
            fi
            restore_tag_ref "$ref"
            scan_tag_object "$ref"
          }

          scan_commit_messages() {
            local label="$1"
            shift
            echo "Scanning ${label} commit identities and messages"
            # %an %ae %cn %ce are not part of the patch, so history mode
            # never sees them. %B is the subject and body. Extra headers such
            # as x-secret sit on the raw commit object and are not in %B.
            git log --pretty=format:'%H%n%an%n%ae%n%cn%n%ce%n%B' "$@" | detect --pipe || exit $?
            git rev-list "$@" | git cat-file --batch | detect --pipe || exit $?
          }

          # Materialise blobs added, changed, or deleted in the rev-list and
          # scan the raw bytes with --no-git. Git text diffs hide archive
          # members. A directory named .gitleaksignore is still scanned. The
          # repo-root ignore file is stored under another name so gitleaks
          # cannot load it from the temp tree. Unsafe paths are renamed, not
          # skipped. Nesting deeper than ARCHIVE_DEPTH fails the job.
          # Every blob side is materialized. A secret overwritten, replaced
          # by a symlink or gitlink, or deleted in this range is still read
          # from the preimage. Identical blob shas are written once.
          walk_archives() {
            local dest="$1"
            python3 - "$dest" "$ARCHIVE_DEPTH" <<'PY'
          import base64
          import bz2
          import io
          import lzma
          import os
          import re
          import sys
          import tarfile
          import zipfile
          import zlib

          dest = sys.argv[1]
          max_depth = int(sys.argv[2])
          MAX_ARCHIVE_BYTES = 32 * 1024 * 1024
          MAX_MEMBERS = 2000
          # One archive may hold 2000 members. A nest of those is not scanned.
          GLOBAL_MAX_MEMBERS = 10000
          GLOBAL_MAX_BYTES = MAX_ARCHIVE_BYTES
          plain_seq = [0]
          budget_members = [0]
          budget_bytes = [0]
          # 16 chars is 12 bytes. base64(zlib(token)) is shorter than 40.
          B64_RE = re.compile(
              rb"(?:[A-Za-z0-9+/]{4}){4,}(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?"
          )
          B64URL_RE = re.compile(
              rb"(?:[A-Za-z0-9_-]{4}){4,}(?:[A-Za-z0-9_-]{2}==|[A-Za-z0-9_-]{3}=)?"
          )
          B64_WRAP_RE = re.compile(
              rb"(?:[A-Za-z0-9+/_-]{4,76}[ \t]*\r?\n){2,}[A-Za-z0-9+/_=-]{0,76}"
          )
          HEX_RE = re.compile(
              rb"(?<![0-9A-Fa-f])(?:[0-9A-Fa-f]{2}){16,}(?![0-9A-Fa-f])"
          )


          def fail_depth():
              sys.exit(3)


          def fail_closed(why):
              print(f"archive scan failed closed: {why}", file=sys.stderr)
              sys.exit(4)


          def charge(persist_plain, size):
              budget_members[0] += 1
              if budget_members[0] > GLOBAL_MAX_MEMBERS:
                  fail_closed("global archive cap")
              if persist_plain:
                  budget_bytes[0] += size
                  if budget_bytes[0] > GLOBAL_MAX_BYTES:
                      fail_closed("global archive cap")


          def xxh32(data, seed=0):
              # LZ4 frame header checksum. Empty input is 0x02CC5D05.
              p1, p2, p3, p4, p5 = 2654435761, 2246822519, 3266489917, 668265263, 374761393

              def u32(value):
                  return value & 0xFFFFFFFF

              def rotl(value, bits):
                  value = u32(value)
                  return u32((value << bits) | (value >> (32 - bits)))

              length = len(data)
              index = 0
              if length >= 16:
                  accs = [u32(seed + p1 + p2), u32(seed + p2), u32(seed), u32(seed - p1)]
                  while index + 16 <= length:
                      for slot in range(4):
                          lane = int.from_bytes(data[index:index + 4], "little")
                          index += 4
                          accs[slot] = u32(rotl(u32(accs[slot] + u32(lane * p2)), 13) * p1)
                  acc = u32(rotl(accs[0], 1) + rotl(accs[1], 7) + rotl(accs[2], 12) + rotl(accs[3], 18))
              else:
                  acc = u32(seed + p5)
              acc = u32(acc + length)
              while index + 4 <= length:
                  lane = int.from_bytes(data[index:index + 4], "little")
                  index += 4
                  acc = u32(rotl(u32(acc + u32(lane * p3)), 17) * p4)
              while index < length:
                  acc = u32(rotl(u32(acc + data[index] * p5), 11) * p1)
                  index += 1
              acc ^= acc >> 15
              acc = u32(acc * p2)
              acc ^= acc >> 13
              acc = u32(acc * p3)
              acc ^= acc >> 16
              return acc


          def lz4_frame_at(data):
              # Framed lz4 only. A bare magic without a valid header checksum
              # is left alone so ordinary bytes are not refused.
              magic = b"\x04\x22\x4d\x18"
              start = 0
              while True:
                  idx = data.find(magic, start)
                  if idx < 0 or idx + 7 > len(data):
                      return -1
                  flg = data[idx + 4]
                  bd = data[idx + 5]
                  block_max = (bd >> 4) & 7
                  if (flg >> 6) != 1 or (flg & 0x02) or (bd & 0x8F) or block_max < 4 or block_max > 7:
                      start = idx + 1
                      continue
                  desc = bytearray((flg, bd))
                  pos = idx + 6
                  if flg & 0x08:
                      if pos + 8 > len(data):
                          start = idx + 1
                          continue
                      desc += data[pos:pos + 8]
                      pos += 8
                  if flg & 0x01:
                      if pos + 4 > len(data):
                          start = idx + 1
                          continue
                      desc += data[pos:pos + 4]
                      pos += 4
                  if pos >= len(data):
                      start = idx + 1
                      continue
                  if ((xxh32(bytes(desc)) >> 8) & 0xFF) != data[pos]:
                      start = idx + 1
                      continue
                  return idx


          def signature_offsets(data):
              # Magic is not only valid at byte 0. A single leading NUL in
              # front of a gzip or zip is still an archive. The first hit wins
              # so a zip is opened before a magic byte inside a member.
              found = []

              def add(idx, kind):
                  if idx >= 0:
                      found.append((idx, kind))

              add(data.find(b"PK\x03\x04"), "zip")
              add(data.find(b"PK\x05\x06"), "zip")
              add(data.find(b"PK\x07\x08"), "zip")
              start = 0
              while True:
                  idx = data.find(b"\x1f\x8b", start)
                  if idx < 0 or idx + 3 > len(data):
                      break
                  if data[idx + 2] == 8:
                      add(idx, "gzip")
                      break
                  start = idx + 1
              start = 0
              while True:
                  idx = data.find(b"BZh", start)
                  if idx < 0 or idx + 10 > len(data):
                      break
                  block = data[idx + 3:idx + 4]
                  if block in b"123456789" and data[idx + 4:idx + 10] == b"\x31\x41\x59\x26\x53\x59":
                      add(idx, "bzip2")
                      break
                  start = idx + 1
              add(data.find(b"\xfd7zXZ\x00"), "xz")
              add(data.find(b"7z\xbc\xaf'\x1c"), "7z")
              add(data.find(b"Rar!\x1a\x07"), "rar")
              add(data.find(b"\x28\xb5\x2f\xfd"), "zstd")
              add(lz4_frame_at(data), "lz4")
              if len(data) > 262 and data[257:262] == b"ustar":
                  add(0, "tar")
              if data.startswith(b"070701") or data.startswith(b"070702"):
                  add(0, "cpio")
              if data.startswith(b"070707"):
                  add(0, "cpio-odc")
              if data.startswith(b"!<arch>\n"):
                  add(0, "ar")
              found.sort()
              return found


          def looks_like_archive(data):
              return bool(signature_offsets(data))


          def write_plain(data):
              plain_seq[0] += 1
              folder = os.path.join(dest, "_extracted")
              os.makedirs(folder, exist_ok=True)
              # Numeric name: member names are not archive extensions, and a
              # member called .gitleaksignore must not become an ignore file.
              out = os.path.join(folder, f"{plain_seq[0]}.txt")
              with open(out, "wb") as handle:
                  handle.write(data)


          def note_header(raw):
              # Raw header bytes must not go through expand(): a cpio or
              # ustar header is itself an archive signature, and parsing
              # that slice fail-closes instead of scanning it. They are a
              # slice of an archive the file and decompression caps already
              # bound, so they are not charged as another member.
              # gitleaks skips a buffer it sniffs as an archive, and a
              # NUL-dense slice is binary (scanned as 0 bytes). A leading
              # newline breaks that sniff. Remaining NULs become newlines
              # so field text stays visible without joining two fields.
              if raw:
                  write_plain(b"\n" + raw.replace(b"\x00", b"\n"))


          def gzip_meta(data):
              # FEXTRA, FNAME, and FCOMMENT are not part of the inflated body.
              if len(data) < 10 or data[0:3] != b"\x1f\x8b\x08":
                  return []
              flags = data[3]
              pos = 10
              fields = []
              if flags & 4:
                  if pos + 2 > len(data):
                      fail_closed("bad archive")
                  xlen = int.from_bytes(data[pos:pos + 2], "little")
                  pos += 2
                  if pos + xlen > len(data):
                      fail_closed("bad archive")
                  if xlen:
                      fields.append(data[pos:pos + xlen])
                  pos += xlen
              if flags & 8:
                  end = data.find(b"\x00", pos)
                  if end < 0:
                      fail_closed("bad archive")
                  if end > pos:
                      fields.append(data[pos:end])
                  pos = end + 1
              if flags & 16:
                  end = data.find(b"\x00", pos)
                  if end < 0:
                      fail_closed("bad archive")
                  if end > pos:
                      fields.append(data[pos:end])
              return fields


          def decompress_capped(data):
              # Incremental decoders expose unused_data. BZ2File and LZMAFile
              # stop after the first stream, and a gzip reader can do the same,
              # so a zip concatenated after the stream would never be scanned.
              # Cap the output before any tar parser: tarfile treats a gzip of
              # NUL bytes as an empty archive and would skip the size check.
              fields = []
              if data.startswith(b"\x1f\x8b"):
                  fields = gzip_meta(data)
                  decoder = zlib.decompressobj(wbits=31)
              elif data.startswith(b"BZh"):
                  decoder = bz2.BZ2Decompressor()
              elif data.startswith(b"\xfd7zXZ\x00"):
                  decoder = lzma.LZMADecompressor()
              else:
                  fail_closed("bad archive")
              try:
                  out = decoder.decompress(data, MAX_ARCHIVE_BYTES + 1)
              except Exception:
                  fail_closed("bad archive")
              if len(out) > MAX_ARCHIVE_BYTES:
                  fail_closed("decompress cap")
              if not decoder.eof:
                  fail_closed("bad archive")
              unused = decoder.unused_data
              if unused == data:
                  fail_closed("bad archive")
              return out, unused, fields


          def zlib_header(data):
              if len(data) < 2:
                  return False
              cmf, flg = data[0], data[1]
              if (cmf & 0x0F) != 8:
                  return False
              return (cmf * 256 + flg) % 31 == 0


          def try_zlib(data, fatal=True):
              # Raw zlib, including a stored zip or cpio member. A header match
              # that does not decode is left for the normal scan. Speculative
              # searches pass fatal=False so a chance header does not abort.
              if not zlib_header(data):
                  return None
              decoder = zlib.decompressobj()
              try:
                  out = decoder.decompress(data, MAX_ARCHIVE_BYTES + 1)
              except Exception:
                  return None
              if len(out) > MAX_ARCHIVE_BYTES:
                  fail_closed("decompress cap")
              if not decoder.eof:
                  if out and fatal:
                      fail_closed("bad archive")
                  return None
              unused = decoder.unused_data
              if unused == data:
                  return None
              parts = [out]
              if unused:
                  parts.append(unused)
              return parts


          def try_lzma_alone(data, fatal=True):
              # FORMAT_ALONE is not the xz magic. Require the default properties
              # and dictionary so ordinary files are not treated as lzma.
              if len(data) < 13 or not data.startswith(b"\x5d\x00\x00\x80\x00"):
                  return None
              decoder = lzma.LZMADecompressor(format=lzma.FORMAT_ALONE)
              try:
                  out = decoder.decompress(data, MAX_ARCHIVE_BYTES + 1)
              except Exception:
                  return None
              if len(out) > MAX_ARCHIVE_BYTES:
                  fail_closed("decompress cap")
              if not decoder.eof:
                  if out and fatal:
                      fail_closed("bad archive")
                  return None
              unused = decoder.unused_data
              if unused == data:
                  return None
              parts = [out]
              if unused:
                  parts.append(unused)
              return parts


          def raw_zip_bytes(archive, info):
              if info.flag_bits & 0x1 or info.compress_size > MAX_ARCHIVE_BYTES:
                  fail_closed("declared size")
              fp = archive.fp
              fp.seek(info.header_offset)
              local = fp.read(30)
              if len(local) != 30 or local[:4] != b"PK\x03\x04":
                  fail_closed("bad archive")
              name_len = int.from_bytes(local[26:28], "little")
              extra_len = int.from_bytes(local[28:30], "little")
              fp.seek(info.header_offset + 30 + name_len + extra_len)
              raw = fp.read(info.compress_size)
              if len(raw) != info.compress_size:
                  fail_closed("bad archive")
              return raw


          def read_zip_member(archive, info):
              declared = max(info.file_size, 0)
              raw = raw_zip_bytes(archive, info)
              if info.compress_type == zipfile.ZIP_STORED:
                  if len(raw) != declared:
                      fail_closed("declared size")
                  return raw
              if info.compress_type != zipfile.ZIP_DEFLATED:
                  fail_closed("unsupported archive")
              decoder = zlib.decompressobj(wbits=-15)
              limit = min(declared, MAX_ARCHIVE_BYTES) + 1
              try:
                  out = decoder.decompress(raw, limit)
              except Exception:
                  fail_closed("bad archive")
              if len(out) > MAX_ARCHIVE_BYTES:
                  fail_closed("decompress cap")
              if len(out) > declared or not decoder.eof or decoder.unused_data:
                  fail_closed("declared size")
              return out


          def locate_eocd(data, comment):
              marker = b"PK\x05\x06"
              record = 22
              candidates = []
              if (
                  len(data) >= record
                  and data[-record:-18] == marker
                  and data[-2:] == b"\x00\x00"
              ):
                  candidates.append(len(data) - record)
              start = max(0, len(data) - (1 << 16) - record)
              pos = len(data)
              while True:
                  rel = data.rfind(marker, start, pos)
                  if rel < 0:
                      break
                  candidates.append(rel)
                  pos = rel
              seen = set()
              for eocd in candidates:
                  if eocd in seen or eocd + record > len(data):
                      continue
                  seen.add(eocd)
                  comment_len = int.from_bytes(data[eocd + 20:eocd + 22], "little")
                  if comment_len > len(data) - (eocd + record):
                      continue
                  if data[eocd + record:eocd + record + comment_len] != comment:
                      continue
                  return eocd
              fail_closed("bad archive")


          def local_spans(archive, info, length):
              # Cover the fixed header, name, compressed bytes, and data
              # descriptor. Leave the local extra field uncovered so it is scanned.
              fp = archive.fp
              fp.seek(info.header_offset)
              local = fp.read(30)
              if len(local) != 30 or local[:4] != b"PK\x03\x04":
                  fail_closed("bad archive")
              name_len = int.from_bytes(local[26:28], "little")
              extra_len = int.from_bytes(local[28:30], "little")
              start = info.header_offset
              name_end = start + 30 + name_len
              data_end = name_end + extra_len + max(info.compress_size, 0)
              if info.flag_bits & 0x8:
                  if data_end > length:
                      fail_closed("bad archive")
                  fp.seek(data_end)
                  sig = fp.read(4)
                  data_end += 16 if sig == b"PK\x07\x08" else 12
              if start < 0 or name_end > length or data_end > length:
                  fail_closed("bad archive")
              spans = [(start, name_end)]
              body_at = name_end + extra_len
              if data_end > body_at:
                  spans.append((body_at, data_end))
              return spans


          def cd_spans(data, cd_off, cd_size):
              # Cover each central-directory fixed header and name. Per-file
              # comments and extra fields stay uncovered and are scanned.
              pos = cd_off
              end = cd_off + cd_size
              spans = []
              while pos < end:
                  if pos + 46 > end or data[pos:pos + 4] != b"PK\x01\x02":
                      fail_closed("bad archive")
                  name_len = int.from_bytes(data[pos + 28:pos + 30], "little")
                  extra_len = int.from_bytes(data[pos + 30:pos + 32], "little")
                  comment_len = int.from_bytes(data[pos + 32:pos + 34], "little")
                  entry_end = pos + 46 + name_len + extra_len + comment_len
                  if entry_end > end:
                      fail_closed("bad archive")
                  spans.append((pos, pos + 46 + name_len))
                  pos = entry_end
              if pos != end:
                  fail_closed("bad archive")
              return spans


          def zip_uncovered(data, archive):
              eocd = locate_eocd(data, archive.comment)
              cd_size = int.from_bytes(data[eocd + 12:eocd + 16], "little")
              cd_off = int.from_bytes(data[eocd + 16:eocd + 20], "little")
              if cd_off == 0xFFFFFFFF or cd_size == 0xFFFFFFFF:
                  fail_closed("unsupported archive")
              if cd_off != archive.start_dir or cd_off + cd_size > eocd:
                  fail_closed("bad archive")
              ranges = [(eocd, eocd + 22)]
              ranges.extend(cd_spans(data, cd_off, cd_size))
              for info in archive.infolist():
                  ranges.extend(local_spans(archive, info, len(data)))
              ranges.sort()
              gaps = []
              cursor = 0
              for start, end in ranges:
                  if start > len(data) or end > len(data) or end < start:
                      fail_closed("bad archive")
                  if start > cursor:
                      gaps.append(data[cursor:start])
                  cursor = max(cursor, end)
              if cursor < len(data):
                  gaps.append(data[cursor:])
              if len(gaps) > MAX_MEMBERS:
                  fail_closed("too many members")
              return gaps


          def note_zip_headers(data, archive):
              # Fixed local and central fields, including the member name,
              # are covered by the span walk above and would otherwise be
              # dropped when this zip is itself inside gzip.
              for info in archive.infolist():
                  archive.fp.seek(info.header_offset)
                  local = archive.fp.read(30)
                  if len(local) != 30 or local[:4] != b"PK\x03\x04":
                      fail_closed("bad archive")
                  name_len = int.from_bytes(local[26:28], "little")
                  extra_len = int.from_bytes(local[28:30], "little")
                  end = info.header_offset + 30 + name_len + extra_len
                  if end > len(data):
                      fail_closed("bad archive")
                  note_header(data[info.header_offset:end])
              eocd = locate_eocd(data, archive.comment)
              cd_size = int.from_bytes(data[eocd + 12:eocd + 16], "little")
              cd_off = int.from_bytes(data[eocd + 16:eocd + 20], "little")
              if cd_off == 0xFFFFFFFF or cd_size == 0xFFFFFFFF:
                  fail_closed("unsupported archive")
              pos = cd_off
              end = cd_off + cd_size
              if end > len(data):
                  fail_closed("bad archive")
              while pos < end:
                  if pos + 46 > end or data[pos:pos + 4] != b"PK\x01\x02":
                      fail_closed("bad archive")
                  name_len = int.from_bytes(data[pos + 28:pos + 30], "little")
                  extra_len = int.from_bytes(data[pos + 30:pos + 32], "little")
                  comment_len = int.from_bytes(data[pos + 32:pos + 34], "little")
                  entry_end = pos + 46 + name_len + extra_len + comment_len
                  if entry_end > end:
                      fail_closed("bad archive")
                  note_header(data[pos:entry_end])
                  pos = entry_end


          def unzip(data):
              bio = io.BytesIO(data)
              if not zipfile.is_zipfile(bio):
                  fail_closed("bad archive")
              bio.seek(0)
              try:
                  with zipfile.ZipFile(bio) as archive:
                      members = [info for info in archive.infolist() if not info.is_dir()]
                      if len(members) > MAX_MEMBERS:
                          fail_closed("too many members")
                      total = 0
                      blobs = []
                      for info in members:
                          declared = max(info.file_size, 0)
                          total += declared
                          if declared > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          blobs.append(read_zip_member(archive, info))
                      note_zip_headers(data, archive)
                      blobs.extend(zip_uncovered(data, archive))
                      return blobs
              except SystemExit:
                  raise
              except Exception:
                  fail_closed("bad archive")


          def embedded_codecs(data):
              # zlib and lzma-alone are otherwise only recognised at offset 0.
              # Member bodies and block padding may start with NUL.
              if len(data) < 6:
                  return []
              found = []
              idx = data.find(b"\x5d\x00\x00\x80\x00", 1)
              if idx > 0:
                  parts = try_lzma_alone(data[idx:], fatal=False)
                  if parts:
                      found.extend(parts)
              index = 1
              while index + 2 <= len(data):
                  if zlib_header(data[index:]):
                      parts = try_zlib(data[index:], fatal=False)
                      if parts:
                          found.extend(parts)
                          break
                  index += 1
              return found


          def untar(data):
              # Every ustar header block, including a GNU long-name or pax
              # header that tarfile consumes without yielding a member.
              off = 0
              while off + 512 <= len(data):
                  if data[off + 257:off + 262] == b"ustar":
                      note_header(data[off:off + 512])
                  off += 512
              bio = io.BytesIO(data)
              try:
                  with tarfile.open(fileobj=bio, mode="r:") as archive:
                      blobs = []
                      count = 0
                      total = 0
                      members = archive.getmembers()
                      tail_at = archive.offset
                      for member in members:
                          name = member.name.encode("utf-8", "surrogateescape")
                          link = member.linkname.encode("utf-8", "surrogateescape")
                          if name:
                              blobs.append(name)
                          if link:
                              blobs.append(link)
                          for key, value in member.pax_headers.items():
                              key_b = str(key).encode("utf-8", "surrogateescape")
                              val_b = str(value).encode("utf-8", "surrogateescape")
                              if key_b:
                                  blobs.append(key_b)
                              if val_b:
                                  blobs.append(val_b)
                          data_off = member.offset_data
                          if isinstance(data_off, int) and data_off >= 0:
                              end = data_off + max(member.size, 0)
                              padded = (end + 511) & ~511
                              if end < padded <= len(data):
                                  pad = data[end:padded]
                                  if pad.strip(b"\x00"):
                                      blobs.append(pad)
                                      blobs.extend(embedded_codecs(pad))
                          # Unknown typeflags (for example 'Z') are not files.
                          # extractfile skips them and the tail starts after
                          # their blocks, so the body has to be read by size.
                          declared = max(member.size, 0)
                          if declared <= 0 or not isinstance(data_off, int) or data_off < 0:
                              continue
                          end = data_off + declared
                          if end > len(data):
                              fail_closed("bad archive")
                          count += 1
                          total += declared
                          if count > MAX_MEMBERS or declared > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          blob = data[data_off:end]
                          if blob:
                              blobs.append(blob)
                              blobs.extend(embedded_codecs(blob))
                      if 0 < tail_at < len(data):
                          blobs.append(data[tail_at:])
                      if len(blobs) > MAX_MEMBERS:
                          fail_closed("too many members")
                      return blobs
              except SystemExit:
                  raise
              except Exception:
                  fail_closed("bad archive")


          def uncpio(data):
              # newc/crc only, and only when the archive itself starts at byte 0.
              pos = 0
              blobs = []
              count = 0
              total = 0
              while pos + 110 <= len(data):
                  magic = data[pos:pos + 6]
                  if magic not in (b"070701", b"070702"):
                      fail_closed("bad archive")
                  note_header(data[pos:pos + 110])
                  try:
                      filesize = int(data[pos + 54:pos + 62], 16)
                      namesize = int(data[pos + 94:pos + 102], 16)
                  except ValueError:
                      fail_closed("bad archive")
                  if namesize <= 0:
                      fail_closed("bad archive")
                  name_off = pos + 110
                  name_end = name_off + namesize
                  data_off = (name_end + 3) & ~3
                  data_end = data_off + filesize
                  pad_end = (data_end + 3) & ~3
                  if name_end > len(data) or pad_end > len(data) or pad_end <= pos:
                      fail_closed("bad archive")
                  name = data[name_off:name_end].split(b"\x00", 1)[0]
                  if name == b"TRAILER!!!":
                      if pad_end < len(data):
                          blobs.append(data[pad_end:])
                      return blobs
                  if name:
                      blobs.append(name)
                  pad = data[name_end:data_off] + data[data_end:pad_end]
                  if pad.strip(b"\x00"):
                      blobs.append(pad)
                  if filesize:
                      count += 1
                      total += filesize
                      if count > MAX_MEMBERS or filesize > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                          fail_closed("declared size")
                      body = data[data_off:data_end]
                      blobs.append(body)
                      blobs.extend(embedded_codecs(body))
                  pos = pad_end
              fail_closed("bad archive")


          def uncpio_odc(data):
              # Portable ASCII cpio. The header is 76 bytes and the payload
              # follows the name with no alignment padding.
              pos = 0
              blobs = []
              count = 0
              total = 0
              while pos + 76 <= len(data):
                  if data[pos:pos + 6] != b"070707":
                      fail_closed("bad archive")
                  note_header(data[pos:pos + 76])
                  try:
                      namesize = int(data[pos + 59:pos + 65], 8)
                      filesize = int(data[pos + 65:pos + 76], 8)
                  except ValueError:
                      fail_closed("bad archive")
                  name_off = pos + 76
                  name_end = name_off + namesize
                  data_end = name_end + filesize
                  if namesize <= 0 or data_end > len(data) or data_end <= pos:
                      fail_closed("bad archive")
                  name = data[name_off:name_end].split(b"\x00", 1)[0]
                  if name == b"TRAILER!!!":
                      if data_end < len(data):
                          blobs.append(data[data_end:])
                      return blobs
                  if name:
                      blobs.append(name)
                  if filesize:
                      count += 1
                      total += filesize
                      if count > MAX_MEMBERS or filesize > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                          fail_closed("declared size")
                      body = data[name_end:data_end]
                      blobs.append(body)
                      blobs.extend(embedded_codecs(body))
                  pos = data_end
              fail_closed("bad archive")


          def unar(data):
              if not data.startswith(b"!<arch>\n"):
                  fail_closed("bad archive")
              pos = 8
              blobs = []
              count = 0
              total = 0
              while pos + 60 <= len(data):
                  header = data[pos:pos + 60]
                  if header[58:60] != b"`\n":
                      fail_closed("bad archive")
                  # Full 60 bytes: the name field after a NUL, and mtime,
                  # uid, gid, and mode. An empty special member has no body
                  # but can still carry those bytes.
                  note_header(header)
                  try:
                      size = int(header[48:58].split()[0])
                  except (ValueError, IndexError):
                      fail_closed("bad archive")
                  name_field = header[:16].split(b"\x00", 1)[0].strip()
                  # Classify before stripping the trailing slash. "/" and
                  # "//" would otherwise become empty and be dropped with
                  # "/SYM64/", body and all.
                  special = name_field in (b"/", b"//", b"/SYM64", b"/SYM64/")
                  name = name_field.rstrip(b"/")
                  body_at = pos + 60
                  body_end = body_at + size
                  if size < 0 or body_end > len(data):
                      fail_closed("bad archive")
                  body = data[body_at:body_end]
                  # An empty symbol table or long-name table has no body
                  # to hide. A nonempty one is an ordinary member: it is
                  # scanned, decoded, and charged against the caps.
                  if not (special and size == 0):
                      if name and not special:
                          blobs.append(name)
                      if size:
                          count += 1
                          total += size
                          if count > MAX_MEMBERS or size > MAX_ARCHIVE_BYTES or total > MAX_ARCHIVE_BYTES:
                              fail_closed("declared size")
                          blobs.append(body)
                          blobs.extend(embedded_codecs(body))
                  pos = body_end + (size & 1)
              if pos < len(data) and data[pos:].strip(b"\n"):
                  blobs.append(data[pos:])
              return blobs


          def open_one_layer(data):
              found = signature_offsets(data)
              if not found:
                  return [data]
              offset, kind = found[0]
              chunk = data[offset:]
              parts = []
              if kind in ("7z", "rar", "zstd", "lz4"):
                  fail_closed("unsupported archive")
              if kind in ("gzip", "bzip2", "xz"):
                  body, unused, fields = decompress_capped(chunk)
                  parts.append(body)
                  parts.extend(fields)
                  if unused:
                      parts.append(unused)
              elif kind == "zip":
                  if chunk.startswith(b"PK\x03\x04") or chunk.startswith(b"PK\x07\x08"):
                      parts.extend(unzip(chunk))
                  else:
                      parts.extend(unzip(data))
                      offset = 0
              elif kind == "tar":
                  parts.extend(untar(data))
                  offset = 0
              elif kind == "cpio":
                  parts.extend(uncpio(data))
                  offset = 0
              elif kind == "cpio-odc":
                  parts.extend(uncpio_odc(data))
                  offset = 0
              elif kind == "ar":
                  parts.extend(unar(data))
                  offset = 0
              else:
                  fail_closed("bad archive")
              if offset > 0:
                  parts.append(data[:offset])
              return parts


          def decode_b64(raw, url):
              text = re.sub(rb"\s+", b"", raw)
              if len(text) < 16 or len(text) % 4:
                  pad = (-len(text)) % 4
                  text += b"=" * pad
              if url:
                  text = text.replace(b"-", b"+").replace(b"_", b"/")
              try:
                  return base64.b64decode(text, validate=True)
              except Exception:
                  return None


          def encoding_candidates(data):
              found = []
              seen = set()

              def push(raw, kind):
                  key = (kind, raw)
                  if key in seen:
                      return
                  seen.add(key)
                  found.append((raw, kind))

              if len(data) >= 16:
                  for match in B64_RE.finditer(data):
                      push(match.group(0), False)
                  for match in B64URL_RE.finditer(data):
                      push(match.group(0), True)
                  for match in B64_WRAP_RE.finditer(data):
                      compact = re.sub(rb"\s+", b"", match.group(0))
                      url = b"-" in compact or b"_" in compact
                      push(compact, url)
                  for match in HEX_RE.finditer(data):
                      push(match.group(0), "hex")
              return found


          def try_prefixed_stream(data):
              # A base64 line can decode to a gzip header and nothing else.
              # Only a finished stream is a container. Truncation is not fatal
              # here; the raw blob path still fail-closes on a short gzip.
              if data.startswith(b"\x1f\x8b\x08"):
                  decoder = zlib.decompressobj(wbits=31)
              elif data.startswith(b"BZh"):
                  decoder = bz2.BZ2Decompressor()
              elif data.startswith(b"\xfd7zXZ\x00"):
                  decoder = lzma.LZMADecompressor()
              else:
                  return None
              try:
                  out = decoder.decompress(data, MAX_ARCHIVE_BYTES + 1)
              except Exception:
                  return None
              if len(out) > MAX_ARCHIVE_BYTES:
                  fail_closed("decompress cap")
              if not getattr(decoder, "eof", False):
                  return None
              unused = decoder.unused_data
              if unused == data:
                  return None
              parts = [out]
              if unused:
                  parts.append(unused)
              return parts


          def encoding_should_expand(data):
              if try_zlib(data, fatal=False) is not None or try_lzma_alone(data, fatal=False) is not None:
                  return True
              if try_prefixed_stream(data) is not None:
                  return True
              if data.startswith((b"070701", b"070702", b"070707", b"!<arch>\n")):
                  return True
              if (data.startswith(b"PK\x03\x04") or data.startswith(b"PK\x05\x06")) and zipfile.is_zipfile(io.BytesIO(data)):
                  return True
              if len(data) > 262 and data[257:262] == b"ustar":
                  return True
              if lz4_frame_at(data) == 0:
                  return True
              if len(data) >= 64 and (
                  data.startswith(b"7z\xbc\xaf'\x1c")
                  or data.startswith(b"Rar!\x1a\x07")
                  or data.startswith(b"\x28\xb5\x2f\xfd")
              ):
                  return True
              return False


          def walk_encodings(data, depth):
              if depth > max_depth or len(data) < 16:
                  return
              for raw, kind in encoding_candidates(data):
                  if kind == "hex":
                      if len(raw) > 1_000_000:
                          continue
                      try:
                          decoded = bytes.fromhex(raw.decode("ascii"))
                      except Exception:
                          continue
                  else:
                      decoded = decode_b64(raw, url=bool(kind))
                  if not decoded or decoded == data or len(decoded) > MAX_ARCHIVE_BYTES:
                      continue
                  if encoding_should_expand(decoded):
                      expand(decoded, depth + 1, True)
                      continue
                  if depth < max_depth and len(decoded) < len(data):
                      walk_encodings(decoded, depth + 1)


          def utf16_ascii(data):
              size = len(data)
              if size < 8 or size % 2:
                  return None
              if data[1::2] == b"\x00" * (size // 2):
                  text = data[0::2]
              elif data[0::2] == b"\x00" * (size // 2):
                  text = data[1::2]
              elif data.startswith(b"\xff\xfe") and data[3::2] == b"\x00" * ((size - 2) // 2):
                  text = data[2::2]
              elif data.startswith(b"\xfe\xff") and data[2::2] == b"\x00" * ((size - 2) // 2):
                  text = data[3::2]
              else:
                  return None
              if not text or any(byte < 9 or (13 < byte < 32) or byte > 126 for byte in text):
                  return None
              return text


          def expand(data, depth, persist_plain):
              charge(persist_plain, len(data))
              zlib_parts = try_zlib(data)
              if zlib_parts is not None:
                  if depth > max_depth:
                      fail_depth()
                  for part in zlib_parts:
                      expand(part, depth + 1, True)
                  return
              lzma_parts = try_lzma_alone(data)
              if lzma_parts is not None:
                  if depth > max_depth:
                      fail_depth()
                  for part in lzma_parts:
                      expand(part, depth + 1, True)
                  return
              if looks_like_archive(data):
                  if depth > max_depth:
                      fail_depth()
                  for part in open_one_layer(data):
                      expand(part, depth + 1, True)
                  return
              text = utf16_ascii(data)
              if text is not None:
                  write_plain(text)
              if persist_plain:
                  write_plain(data)
              walk_encodings(data, depth)


          archive_files = []
          for dirpath, _dirnames, filenames in os.walk(dest):
              for filename in filenames:
                  archive_files.append(os.path.join(dirpath, filename))
          for blob_path in archive_files:
              # Do not decide from a prefix. A signature past 32MiB must not
              # scan as a clean blob, and reading that far is not required.
              if os.path.getsize(blob_path) > MAX_ARCHIVE_BYTES:
                  fail_closed("compressed blob exceeds cap")
              with open(blob_path, "rb") as handle:
                  payload = handle.read()
              # persist_plain is false: the on-disk blob is already scanned.
              # Extracted and decoded bytes are written.
              expand(payload, 1, False)
          PY
          }

          scan_materialized_tree() {
            local dest="$1"
            local label="${2:-blob}"
            local py_rc rc
            set +e
            walk_archives "$dest"
            py_rc=$?
            set -e
            if [ "$py_rc" -eq 3 ]; then
              echo "::error::Archive nesting exceeds the configured scan depth"
              rm -rf "$dest"
              exit 1
            fi
            if [ "$py_rc" -eq 4 ]; then
              echo "::error::Archive could not be fully scanned"
              rm -rf "$dest"
              exit 1
            fi
            if [ "$py_rc" -ne 0 ]; then
              echo "::error::Changed-blob scan could not read the tree"
              rm -rf "$dest"
              exit "$py_rc"
            fi
            if ! find "$dest" -type f -print -quit | grep -q .; then
              echo "No changed blobs in ${label}"
              rm -rf "$dest"
              return 0
            fi
            set +e
            detect --no-git --source "$dest"
            rc=$?
            set -e
            rm -rf "$dest"
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          }

          scan_piped_blob() {
            local dest
            dest="$(mktemp -d)"
            cat > "$dest/blob"
            scan_materialized_tree "$dest" "tag blob"
          }

          scan_changed_blobs() {
            local label="$1"
            shift
            local dest rc py_rc
            dest="$(mktemp -d)"
            echo "Scanning ${label} changed blobs (--no-git)"
            set +e
            python3 - "$dest" "$ARCHIVE_DEPTH" "$@" <<'PY'
          import hashlib
          import os
          import subprocess
          import sys

          dest = sys.argv[1]
          rev_args = sys.argv[3:]
          if not rev_args:
              sys.exit("changed-blob scan is missing rev-list args")
          listed = subprocess.run(
              ["git", "rev-list", *rev_args],
              check=False,
              capture_output=True,
          )
          if listed.returncode != 0:
              sys.stderr.buffer.write(listed.stderr)
              sys.exit(listed.returncode or 1)
          commits = [line.decode() for line in listed.stdout.splitlines() if line]
          written = 0
          seen_blobs = set()

          def emit(commit, mode, blob, rel_b, side):
              global written
              if mode == "160000" or set(blob) <= {"0"}:
                  return
              if blob in seen_blobs:
                  return
              rel = rel_b.decode("utf-8", "surrogateescape")
              # History fingerprint for this blob does not match a --no-git
              # path under the temp tree. Skip materializing it so that
              # pass stays green. Other blobs in the commit are kept.
              if (
                  commit == "9d2a49ebf8b5eaeba177a5c477ad123cf748f1d2"
                  and rel == ".claude/settings.local.json"
              ):
                  return
              # Backslash is a legal git byte. Folding it into '/' can
              # manufacture a '..' component. Never drop the blob.
              segments = []
              unsafe = "\\" in rel or rel.startswith("/") or "\x00" in rel
              if not unsafe:
                  for segment in rel.split("/"):
                      if segment in ("", "."):
                          continue
                      if segment == "..":
                          unsafe = True
                          break
                      segments.append(segment)
                  if not segments:
                      unsafe = True
              # Directory name is unique per staged copy. A preimage of
              # `foo` must not share a path with an added `preimage/foo`,
              # or the later write erases the earlier blob. Identical
              # shas already returned above.
              stamp = f"{side}-{written}-{blob}"
              if unsafe:
                  segments = [stamp]
              # sha256 of the historical line, not the line. 1e844d1e
              # keeps that line while editing the rest of the file.
              historical_jwt_line = (
                  "64cb62f049e65ec92a4a82421d832bce233644d8746d2a8daf21d3b88ff272ac"
              )
              # Only the repo-root ignore file can be loaded by gitleaks
              # when it sits at the scan root. Keep the bytes, under a
              # name that is not an ignore file. Paths under a directory
              # named .gitleaksignore are materialized unchanged.
              if not unsafe:
                  if segments == [".gitleaksignore"]:
                      segments = ["gitleaksignore.blob"]
                  segments = [stamp, *segments]
              out = os.path.join(dest, commit, *segments)
              parent = os.path.dirname(out)
              os.makedirs(parent, exist_ok=True)
              blob_proc = subprocess.run(
                  ["git", "cat-file", "blob", blob],
                  check=False,
                  capture_output=True,
              )
              if blob_proc.returncode != 0:
                  sys.stderr.buffer.write(blob_proc.stderr)
                  sys.exit(blob_proc.returncode or 1)
              payload = blob_proc.stdout
              if rel == ".claude/settings.local.json":
                  rows = payload.splitlines()
                  if (
                      len(rows) >= 25
                      and hashlib.sha256(rows[24]).hexdigest() == historical_jwt_line
                  ):
                      rows[24] = b""
                      payload = b"\n".join(rows)
                      if blob_proc.stdout.endswith(b"\n"):
                          payload += b"\n"
              with open(out, "wb") as handle:
                  handle.write(payload)
              seen_blobs.add(blob)
              written += 1

          for commit in commits:
              diff = subprocess.run(
                  [
                      "git",
                      "diff-tree",
                      "-r",
                      "--no-commit-id",
                      "--root",
                      "--diff-filter=ACMRTD",
                      "-z",
                      "-m",
                      commit,
                  ],
                  check=False,
                  capture_output=True,
              )
              if diff.returncode != 0:
                  sys.stderr.buffer.write(diff.stderr)
                  sys.exit(diff.returncode or 1)
              parts = diff.stdout.split(b"\0")
              index = 0
              while index < len(parts):
                  meta = parts[index]
                  if not meta.startswith(b":"):
                      index += 1
                      continue
                  fields = meta.split()
                  if len(fields) < 5:
                      index += 1
                      continue
                  status = fields[4].decode()
                  index += 1
                  if index >= len(parts):
                      break
                  old_rel = parts[index]
                  index += 1
                  new_rel = old_rel
                  if status[:1] in ("R", "C"):
                      if index >= len(parts):
                          break
                      new_rel = parts[index]
                      index += 1
                  kind = status[:1]
                  if kind not in ("A", "C", "M", "R", "T", "D"):
                      continue
                  # Read every blob side. A modify or type change must not
                  # drop the preimage, including when the new side is a
                  # symlink (120000) or a gitlink (160000). diff-tree
                  # prefixes only the preimage mode with ':'.
                  old_mode = fields[0].decode().lstrip(":")
                  new_mode = fields[1].decode()
                  old_blob = fields[2].decode()
                  new_blob = fields[3].decode()
                  if kind in ("D", "M", "T", "R", "C"):
                      emit(commit, old_mode, old_blob, old_rel, "preimage")
                  if kind in ("A", "M", "T", "R", "C"):
                      emit(commit, new_mode, new_blob, new_rel, "side")
          print(f"materialized {written} changed blobs", file=sys.stderr)

          PY
            py_rc=$?
            set -e
            if [ "$py_rc" -ne 0 ]; then
              echo "::error::Changed-blob scan could not read the tree"
              rm -rf "$dest"
              exit "$py_rc"
            fi
            scan_materialized_tree "$dest" "$label"
          }

          scan_rev() {
            local label="$1"
            shift
            # Archive caps run before history detect. History mode opens a
            # .gz/.zip by filename and would inflate a zero-filled gzip with
            # no cap if this check did not fail the job first.
            scan_changed_blobs "$label" "$@"
            run_detect --log-opts="${TEXT_LOG} ${*}"
            scan_commit_messages "$label" "$@"
          }

          scan_annotated_tags() {
            local objtype ref
            local found=0
            while IFS=' ' read -r objtype ref; do
              if [ "${objtype:-}" != "tag" ]; then
                continue
              fi
              found=1
              scan_tag_object "$ref"
            done < <(git for-each-ref --format='%(objecttype) %(refname)' refs/tags)
            if [ "$found" -eq 0 ]; then
              echo "No annotated tag objects to scan"
            fi
          }

          # Names already in the clone, plus the pushed ref. Dispatch fetches
          # tags below and scans names again.
          scan_ref_names

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Fetching tags for annotated tag object scan"
            if ! git fetch --quiet origin '+refs/tags/*:refs/tags/*'; then
              echo "::error::Could not fetch tags; refusing to skip annotated tag scan"
              exit 1
            fi
            # gitleaks' default --diff-filter=tuxdb uses lowercase letters, which
            # exclude those types. "t" drops type changes, so a symlink replaced
            # by a file never appears in the history diff. uxdb still skips
            # unmerged, unknown, deletions, and broken pairs, and keeps T.
            # -m and --text stay so merge diffs and binary/-diff patches are
            # included. Blobs use rev-list --all.
            scan_ref_names
            scan_changed_blobs "dispatch" --all
            run_detect --log-opts="${TEXT_LOG} --full-history --all --diff-filter=uxdb"
            scan_commit_messages "dispatch" --all --full-history
            scan_annotated_tags
          elif [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # New branch or tag: github.event.before is 40 zeros. Do not scan
            # only the tip (-1). Scan commits reachable from HEAD that are not
            # already on another origin ref. fetch-depth: 0 includes this ref,
            # so a new branch must be excluded or --remotes=origin hides every
            # new commit. With --remotes, --exclude is matched against the
            # short name (origin/<branch>), not refs/remotes/....
            # If that ref cannot be excluded safely, scan every commit
            # reachable from HEAD. If the walk itself fails, exit non-zero.
            self_ref=""
            exclude_pat=""
            case "${GITHUB_REF:-}" in
              refs/heads/*)
                self_ref="refs/remotes/origin/${GITHUB_REF#refs/heads/}"
                exclude_pat="origin/${GITHUB_REF#refs/heads/}"
                ;;
            esac

            mode="all"
            if [ -n "$self_ref" ] && git show-ref --verify --quiet "$self_ref"; then
              self_sha="$(git rev-parse "$self_ref")"
              head_sha="$(git rev-parse HEAD)"
              if [ "$self_sha" = "$head_sha" ]; then
                mode="compare"
              else
                echo "::warning::Pushed ref does not match HEAD (${head_sha}); scanning every commit reachable from HEAD"
              fi
            elif [ -n "$self_ref" ]; then
              echo "::warning::Pushed branch is absent from origin; scanning every commit reachable from HEAD"
            else
              # Tag, or any new ref that is not a branch. Compare against
              # every origin branch. The tag itself is not a remote-tracking ref.
              mode="compare"
            fi

            if [ "$mode" = "compare" ] && [ -n "$exclude_pat" ]; then
              rev_args=(HEAD --not --exclude="$exclude_pat" --remotes=origin)
            elif [ "$mode" = "compare" ]; then
              rev_args=(HEAD --not --remotes=origin)
            else
              rev_args=(HEAD)
            fi

            if ! count="$(git rev-list --count "${rev_args[@]}")"; then
              echo "::error::New-ref secret scan cannot be resolved"
              exit 1
            fi
            if [ "$count" -eq 0 ]; then
              if is_tag_ref; then
                echo "New tag has no commits beyond other remote refs"
                scan_pushed_tag
                exit 0
              fi
              # Two new branches can point at the same secret commit. Each
              # sibling is an origin remote, so the comparison above is empty
              # and used to exit 0. Fail closed unless those commits are
              # already on a long-lived base branch.
              others=""
              if [ "$mode" = "compare" ]; then
                others="$(git for-each-ref --format='%(refname)' refs/remotes/origin | grep -v -x -F "${self_ref:-__no_such_ref__}" || true)"
              fi
              if [ -z "$others" ]; then
                echo "::error::New-ref secret scan range is empty"
                exit 1
              fi
              BASE_REFS=()
              for candidate in refs/remotes/origin/develop refs/remotes/origin/master refs/remotes/origin/main; do
                if git show-ref --verify --quiet "$candidate"; then
                  BASE_REFS+=("$candidate")
                fi
              done
              origin_head="$(git symbolic-ref -q refs/remotes/origin/HEAD || true)"
              if [ -n "$origin_head" ] && git show-ref --verify --quiet "$origin_head"; then
                seen=0
                for existing in "${BASE_REFS[@]}"; do
                  if [ "$existing" = "$origin_head" ]; then
                    seen=1
                  fi
                done
                if [ "$seen" -eq 0 ]; then
                  BASE_REFS+=("$origin_head")
                fi
              fi
              if [ "${#BASE_REFS[@]}" -eq 0 ]; then
                echo "::error::New-ref secret scan has no base branch to compare; refusing to treat an empty remote comparison as clean"
                exit 1
              fi
              if ! base_count="$(git rev-list --count HEAD --not "${BASE_REFS[@]}")"; then
                echo "::error::New-ref base comparison cannot be resolved"
                exit 1
              fi
              if [ "$base_count" -eq 0 ]; then
                echo "New ref has no commits beyond base branches"
                scan_pushed_tag
                exit 0
              fi
              echo "New ref matches another remote but not a base branch (${base_count} commits)"
              rev_args=(HEAD --not "${BASE_REFS[@]}")
              count="$base_count"
            fi
            echo "New ref secret scan (${count} commits)"
            scan_rev "new ref" "${rev_args[@]}"
            scan_pushed_tag
          elif [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
            preflight_range "PR" "$range"
            scan_rev "PR" "$range"
          else
            # Tag moves (before is not all zeros) still carry a tag message.
            scan_pushed_tag
            range="${BASE_SHA}..HEAD"
            preflight_range "Push" "$range"
            scan_rev "push" "$range"
          fi
