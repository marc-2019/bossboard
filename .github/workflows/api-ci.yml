# BossBoard API CI
# Fails this GitHub check when API tests or the TypeScript build fail.
# This workflow does not deploy and does not call Railway.
#
# Railway GitHub autodeploy, if the service is connected, is separate.
# railway.toml watchPatterns choose which pushes rebuild. They do not
# wait for this check. "Wait for CI" is a Railway service setting, not
# a railway.toml key. Until that is on, a red run here does not stop a
# Railway release. Required status checks are not set in this repo.

name: BossBoard API CI

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'database/**'
      - 'Dockerfile.api'
      - 'docker-compose.production.yml'
      - 'railway.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'database/**'
      - 'Dockerfile.api'
      - 'docker-compose.production.yml'
      - 'railway.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bossboard_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: bossboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bossboard_test:test_password@localhost:5432/bossboard_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-32-chars-minimum
      JWT_REFRESH_SECRET: test-refresh-secret-32-chars-min
      NODE_ENV: test
      PORT: 29000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        run: |
          PGPASSWORD=test_password psql -h localhost -U bossboard_test -d bossboard_test -f database/init.sql

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      # Fail closed. Do not add continue-on-error, `|| true`, or `|| echo`.
      - name: Run tests
        working-directory: apps/api
        run: npm test

      - name: Build TypeScript
        working-directory: apps/api
        run: npm run build

  # Does not deploy. success() is written out so this gate stays tied to
  # the test job. GitHub also applies success() when an if has no status
  # function; do not replace that with always() or failure().
  # Railway is not invoked here. See the file header.
  ci-gate:
    name: CI gate (does not deploy)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ success() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    steps:
      - name: Tests passed; this job does not deploy
        run: |
          echo "API tests and the TypeScript build passed. This workflow does not deploy."
          echo "Railway autodeploy is not gated by this job until Wait for CI is enabled on the service."
